# === Journal Logs ===
[INPUT]
    Name              systemd
    Tag               system.journal
    Path              /var/log/journal
    DB                /var/log/fluent-bit/journal.db
    Mem_Buf_Limit     5MB
    Systemd_Filter    _SYSTEMD_UNIT=xvpn-api.service
    Systemd_Filter    _SYSTEMD_UNIT=xvpn-agent.service
    Systemd_Filter    _SYSTEMD_UNIT=xvpn-bot.service
    Systemd_Filter    _SYSTEMD_UNIT=xvpn-worker.service
    Systemd_Filter    _SYSTEMD_UNIT=xvpn-orchestrator.service
    Systemd_Filter    _SYSTEMD_UNIT=xvpn-core.service

# === Filter Configuration ===
[FILTER]
    Name          record_modifier
    Match         xvpn.*
    Record        hostname ${HOSTNAME}
    Record        service ${TAG[1]}
    Record        timestamp ${time.strftime('%Y-%m-%dT%H:%M:%S.%NZ')}

[FILTER]
    Name          record_modifier
    Match         system.*
    Record        hostname ${HOSTNAME}
    Record        timestamp ${time.strftime('%Y-%m-%dT%H:%M:%S.%NZ')}

# === Output Configuration ===
# === Loki Output ===
[OUTPUT]
    Name          loki
    Match         xvpn.*
    Host          loki
    Port          3100
    Labels        job=xvpn-$TAG[1],service=$TAG[1],hostname=$hostname
    BatchWait     1s
    BatchSize     1048576
    Timeout       10s
    Proxy         Off
    Tls           Off
    Tls.Verify    Off
    Tls.Debug     1
    Http_User     
    Http_Passwd   

[OUTPUT]
    Name          loki
    Match         system.*
    Host          loki
    Port          3100
    Labels        job=system-$TAG[1],service=$TAG[1],hostname=$hostname
    BatchWait     1s
    BatchSize     1048576
    Timeout       10s
    Proxy         Off
    Tls           Off
    Tls.Verify    Off
    Tls.Debug     1
    Http_User     
    Http_Passwd   

# === HTTP Output (для тестирования) ===
[OUTPUT]
    Name          http
    Match         *
    Host          localhost
    Port          8080
    Uri           /logs
    Format        json
    Header        Content-Type application/json
    Http_User     
    Http_Passwd   

# === File Output (для локального хранения) ===
[OUTPUT]
    Name          file
    Match         *
    Path          /var/log/fluent-bit/aggregated.log
    Format        json_lines

# === Standard Output (для отладки) ===
[OUTPUT]
    Name          stdout
    Match         *
    Format        json_lines

# === Parsers Configuration ===
# parsers.conf

[PARSER]
    Name        json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On

[PARSER]
    Name        syslog
    Format      regex
    Regex       ^(?<time>[^ ]* [^ ]*) (?<hostname>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?: *(?<message>.*)$
    Time_Key    time
    Time_Format %b %d %H:%M:%S
    Time_Keep   On

[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On

# === Plugins Configuration ===
# plugins.conf

[PLUGINS]
    # Loki plugin
    Path /fluent-bit/bin/out_loki.so

# === Additional Configuration ===
# Additional fluent-bit configuration
additional_arguments:
    # Additional command line arguments
    - "--config=/etc/fluent-bit/fluent-bit.conf"
    - "--log-level=info"
    - "--log-file=/var/log/fluent-bit/fluent-bit.log"
    - "--daemon=false"
    - "--flush=5"
    - "--http-server=on"
    - "--http-listen=0.0.0.0"
    - "--http-port=2020"
    - "--health-check=on"
    - "--storage-metrics=on"
    - "--parsers-file=/etc/fluent-bit/parsers.conf"
    - "--plugins-file=/etc/fluent-bit/plugins.conf"
    - "--mem-buf-limit=5MB"
    - "--buffer-chunk-size=32k"
    - "--buffer-max-size=256k"
    - "--skip-long-lines=on"
    - "--read-from-head=true"
    - "--refresh-interval=5"
    - "--db=/var/log/fluent-bit/fluent-bit.db"
    - "--tag=xvpn.*"
    - "--match=*"
    - "--host=loki"
    - "--port=3100"
    - "--labels=job=xvpn-$TAG[1],service=$TAG[1],hostname=$hostname"
    - "--batch-wait=1s"
    - "--batch-size=1048576"
    - "--timeout=10s"
    - "--proxy=off"
    - "--tls=off"
    - "--tls.verify=off"
    - "--tls.debug=1"
    - "--http.user="
    - "--http.passwd="
    - "--format=json_lines"
    - "--path=/var/log/fluent-bit/aggregated.log"
    - "--uri=/logs"
    - "--header=Content-Type application/json"