# XVPN Systemd Services Configuration
# Конфигурация systemd сервисов для XVPN

# === XVPN API Service ===
[Unit]
Description=XVPN API Service
After=network.target docker.service
Wants=network.target docker.service
Requires=network.target docker.service

[Service]
Type=simple
User=xvpn
Group=xvpn
WorkingDirectory=/opt/xvpn/server/api
Environment=PYTHONPATH=/opt/xvpn/server/api
ExecStart=/usr/bin/python3 /opt/xvpn/server/api/app.py
Restart=always
RestartSec=5
StandardOutput=journal
StandardError=journal
SyslogIdentifier=xvpn-api

# Security settings
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/opt/xvpn/server/api /var/log/xvpn /opt/xvpn/data
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictSUIDSGID=true
RemoveIPC=true
PrivateUsers=true

# Resource limits
LimitNOFILE=65536
LimitNPROC=4096
MemoryMax=1G
CPUQuota=50%
TasksMax=512

[Install]
WantedBy=multi-user.target

