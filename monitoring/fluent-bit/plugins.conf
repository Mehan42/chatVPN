# XVPN Fluent Bit Plugins Configuration
# Конфигурация плагинов Fluent Bit

# === Plugins Configuration ===
[PLUGINS]
    # Loki plugin
    Path /fluent-bit/bin/out_loki.so
    
    # HTTP plugin
    Path /fluent-bit/bin/out_http.so
    
    # File plugin
    Path /fluent-bit/bin/out_file.so
    
    # Stdout plugin
    Path /fluent-bit/bin/out_stdout.so
    
    # Systemd plugin
    Path /fluent-bit/bin/in_systemd.so
    
    # Tail plugin
    Path /fluent-bit/bin/in_tail.so
    
    # Filter plugin
    Path /fluent-bit/bin/filter_record_modifier.so
    
    # Parser plugin
    Path /fluent-bit/bin/parser_json.so

# === Additional Plugins ===
# Additional plugins configuration
additional_plugins:
    # Loki output plugin
    - name: out_loki
      path: /fluent-bit/bin/out_loki.so
      type: output
      
    # HTTP output plugin
    - name: out_http
      path: /fluent-bit/bin/out_http.so
      type: output
      
    # File output plugin
    - name: out_file
      path: /fluent-bit/bin/out_file.so
      type: output
      
    # Stdout output plugin
    - name: out_stdout
      path: /fluent-bit/bin/out_stdout.so
      type: output
      
    # Systemd input plugin
    - name: in_systemd
      path: /fluent-bit/bin/in_systemd.so
      type: input
      
    # Tail input plugin
    - name: in_tail
      path: /fluent-bit/bin/in_tail.so
      type: input
      
    # Record modifier filter plugin
    - name: filter_record_modifier
      path: /fluent-bit/bin/filter_record_modifier.so
      type: filter
      
    # JSON parser plugin
    - name: parser_json
      path: /fluent-bit/bin/parser_json.so
      type: parser

# === Plugin Settings ===
plugin_settings:
    # Loki plugin settings
    out_loki:
        # Enable plugin
        enabled: true
        
        # Plugin path
        path: /fluent-bit/bin/out_loki.so
        
        # Plugin type
        type: output
        
        # Plugin configuration
        config:
            # Host
            host: loki
            
            # Port
            port: 3100
            
            # Labels
            labels: job=xvpn-${TAG[1]},service=${TAG[1]},hostname=${HOSTNAME}
            
            # Batch wait
            batch_wait: 1s
            
            # Batch size
            batch_size: 1048576
            
            # Timeout
            timeout: 10s
            
            # Proxy
            proxy: off
            
            # TLS
            tls: off
            
            # TLS verify
            tls_verify: off
            
            # TLS debug
            tls_debug: 1
            
            # HTTP user
            http_user: ""
            
            # HTTP password
            http_passwd: ""
            
    # HTTP plugin settings
    out_http:
        # Enable plugin
        enabled: true
        
        # Plugin path
        path: /fluent-bit/bin/out_http.so
        
        # Plugin type
        type: output
        
        # Plugin configuration
        config:
            # Host
            host: localhost
            
            # Port
            port: 8080
            
            # URI
            uri: /logs
            
            # Format
            format: json
            
            # Header
            header: Content-Type application/json
            
            # HTTP user
            http_user: ""
            
            # HTTP password
            http_passwd: ""
            
    # File plugin settings
    out_file:
        # Enable plugin
        enabled: true
        
        # Plugin path
        path: /fluent-bit/bin/out_file.so
        
        # Plugin type
        type: output
        
        # Plugin configuration
        config:
            # Path
            path: /var/log/fluent-bit/aggregated.log
            
            # Format
            format: json_lines
            
    # Stdout plugin settings
    out_stdout:
        # Enable plugin
        enabled: true
        
        # Plugin path
        path: /fluent-bit/bin/out_stdout.so
        
        # Plugin type
        type: output
        
        # Plugin configuration
        config:
            # Format
            format: json_lines
            
    # Systemd plugin settings
    in_systemd:
        # Enable plugin
        enabled: true
        
        # Plugin path
        path: /fluent-bit/bin/in_systemd.so
        
        # Plugin type
        type: input
        
        # Plugin configuration
        config:
            # Tag
            tag: system.journal
            
            # Path
            path: /var/log/journal
            
            # DB
            db: /var/log/fluent-bit/journal.db
            
            # Mem buf limit
            mem_buf_limit: 5MB
            
            # Systemd filter
            systemd_filter: 
                - _SYSTEMD_UNIT=xvpn-api.service
                - _SYSTEMD_UNIT=xvpn-agent.service
                - _SYSTEMD_UNIT=xvpn-bot.service
                - _SYSTEMD_UNIT=xvpn-worker.service
                - _SYSTEMD_UNIT=xvpn-orchestrator.service
                - _SYSTEMD_UNIT=xvpn-core.service
                
    # Tail plugin settings
    in_tail:
        # Enable plugin
        enabled: true
        
        # Plugin path
        path: /fluent-bit/bin/in_tail.so
        
        # Plugin type
        type: input
        
        # Plugin configuration
        config:
            # Path
            path: /var/log/xvpn/*.log
            
            # Parser
            parser: json
            
            # Tag
            tag: xvpn.*
            
            # Refresh interval
            refresh_interval: 5
            
            # Read from head
            read_from_head: true
            
            # Buffer chunk size
            buffer_chunk_size: 32k
            
            # Buffer max size
            buffer_max_size: 256k
            
            # Skip long lines
            skip_long_lines: on
            
            # DB
            db: /var/log/fluent-bit/xvpn.db
            
            # Mem buf limit
            mem_buf_limit: 5MB
            
    # Record modifier filter settings
    filter_record_modifier:
        # Enable plugin
        enabled: true
        
        # Plugin path
        path: /fluent-bit/bin/filter_record_modifier.so
        
        # Plugin type
        type: filter
        
        # Plugin configuration
        config:
            # Match
            match: xvpn.*
            
            # Records
            records:
                - hostname: ${HOSTNAME}
                - service: ${TAG[1]}
                - timestamp: ${time.strftime('%Y-%m-%dT%H:%M:%S.%NZ')}
                
    # JSON parser settings
    parser_json:
        # Enable plugin
        enabled: true
        
        # Plugin path
        path: /fluent-bit/bin/parser_json.so
        
        # Plugin type
        type: parser
        
        # Plugin configuration
        config:
            # Name
            name: json
            
            # Format
            format: json
            
            # Time key
            time_key: timestamp
            
            # Time format
            time_format: %Y-%m-%dT%H:%M:%S.%LZ
            
            # Time keep
            time_keep: on

# === Plugin Loading ===
plugin_loading:
    # Load plugins at startup
    load_at_startup: true
    
    # Auto reload plugins
    auto_reload: true
    
    # Plugin reload interval
    reload_interval: 60
    
    # Plugin reload timeout
    reload_timeout: 30
    
    # Plugin reload max retries
    reload_max_retries: 3

# === Plugin Security ===
plugin_security:
    # Enable plugin security
    enabled: true
    
    # Plugin signature verification
    signature_verification: true
    
    # Plugin whitelist
    whitelist:
        - out_loki
        - out_http
        - out_file
        - out_stdout
        - in_systemd
        - in_tail
        - filter_record_modifier
        - parser_json
        
    # Plugin blacklist
    blacklist: []
    
    # Plugin integrity checks
    integrity_checks: true
    
    # Plugin sandboxing
    sandboxing: true

# === Plugin Performance ===
plugin_performance:
    # Plugin performance monitoring
    monitoring: true
    
    # Plugin performance metrics
    metrics: true
    
    # Plugin performance alerts
    alerts: true
    
    # Plugin performance thresholds
    thresholds:
        # CPU usage threshold
        cpu_usage: 80
        
        # Memory usage threshold
        memory_usage: 85
        
        # Disk usage threshold
        disk_usage: 90
        
        # Network usage threshold
        network_usage: 95

# === Plugin Logging ===
plugin_logging:
    # Enable plugin logging
    enabled: true
    
    # Plugin log level
    level: info
    
    # Plugin log format
    format: json
    
    # Plugin log file
    file: /var/log/fluent-bit/plugins.log
    
    # Plugin log rotation
    rotation: true
    
    # Plugin log retention
    retention: 7d

# === Plugin Debugging ===
plugin_debugging:
    # Enable plugin debugging
    enabled: false
    
    # Plugin debug level
    level: debug
    
    # Plugin debug format
    format: json
    
    # Plugin debug file
    file: /var/log/fluent-bit/debug.log
    
    # Plugin debug rotation
    rotation: true
    
    # Plugin debug retention
    retention: 1d

# === Plugin Testing ===
plugin_testing:
    # Enable plugin testing
    enabled: true
    
    # Plugin test interval
    interval: 30s
    
    # Plugin test timeout
    timeout: 10s
    
    # Plugin test max retries
    max_retries: 3

# === Plugin Updates ===
plugin_updates:
    # Enable plugin updates
    enabled: true
    
    # Plugin update interval
    interval: 24h
    
    # Plugin update timeout
    timeout: 30s
    
    # Plugin update max retries
    max_retries: 3

# === Plugin Dependencies ===
plugin_dependencies:
    # Plugin dependencies
    dependencies:
        # Loki plugin dependencies
        out_loki:
            - libssl
            - libcrypto
            - libcurl
            - libz
            
        # HTTP plugin dependencies
        out_http:
            - libcurl
            - libz
            
        # File plugin dependencies
        out_file:
            - libc
            
        # Stdout plugin dependencies
        out_stdout:
            - libc
            
        # Systemd plugin dependencies
        in_systemd:
            - libsystemd
            - libz
            
        # Tail plugin dependencies
        in_tail:
            - libc
            - libz
            
        # Record modifier filter dependencies
        filter_record_modifier:
            - libc
            
        # JSON parser dependencies
        parser_json:
            - libc
            - libz

# === Plugin Compatibility ===
plugin_compatibility:
    # Plugin compatibility matrix
    compatibility_matrix:
        # Loki plugin compatibility
        out_loki:
            - fluent-bit: ">=1.8.0"
            - loki: ">=2.0.0"
            
        # HTTP plugin compatibility
        out_http:
            - fluent-bit: ">=1.0.0"
            
        # File plugin compatibility
        out_file:
            - fluent-bit: ">=1.0.0"
            
        # Stdout plugin compatibility
        out_stdout:
            - fluent-bit: ">=1.0.0"
            
        # Systemd plugin compatibility
        in_systemd:
            - fluent-bit: ">=1.8.0"
            - systemd: ">=245"
            
        # Tail plugin compatibility
        in_tail:
            - fluent-bit: ">=1.0.0"
            
        # Record modifier filter compatibility
        filter_record_modifier:
            - fluent-bit: ">=1.0.0"
            
        # JSON parser compatibility
        parser_json:
            - fluent-bit: ">=1.0.0"

# === Plugin Documentation ===
plugin_documentation:
    # Plugin documentation
    documentation:
        # Loki plugin documentation
        out_loki:
            - name: Loki Output Plugin
            - description: Output plugin for sending logs to Loki
            - url: https://docs.fluentbit.io/manual/pipeline/outputs/loki
            
        # HTTP plugin documentation
        out_http:
            - name: HTTP Output Plugin
            - description: Output plugin for sending logs via HTTP
            - url: https://docs.fluentbit.io/manual/pipeline/outputs/http
            
        # File plugin documentation
        out_file:
            - name: File Output Plugin
            - description: Output plugin for writing logs to files
            - url: https://docs.fluentbit.io/manual/pipeline/outputs/file
            
        # Stdout plugin documentation
        out_stdout:
            - name: Stdout Output Plugin
            - description: Output plugin for writing logs to stdout
            - url: https://docs.fluentbit.io/manual/pipeline/outputs/stdout
            
        # Systemd plugin documentation
        in_systemd:
            - name: Systemd Input Plugin
            - description: Input plugin for reading from systemd journal
            - url: https://docs.fluentbit.io/manual/pipeline/inputs/systemd
            
        # Tail plugin documentation
        in_tail:
            - name: Tail Input Plugin
            - description: Input plugin for reading from files
            - url: https://docs.fluentbit.io/manual/pipeline/inputs/tail
            
        # Record modifier filter documentation
        filter_record_modifier:
            - name: Record Modifier Filter
            - description: Filter plugin for modifying records
            - url: https://docs.fluentbit.io/manual/pipeline/filters/record-modifier
            
        # JSON parser documentation
        parser_json:
            - name: JSON Parser
            - description: Parser for JSON formatted logs
            - url: https://docs.fluentbit.io/manual/pipeline/parsers/json

# === Plugin Examples ===
plugin_examples:
    # Plugin examples
    examples:
        # Loki plugin example
        out_loki:
            - name: Loki Output Example
            - config: |
                [OUTPUT]
                    Name          loki
                    Match         *
                    Host          loki
                    Port          3100
                    Labels        job=fluent-bit, service=logging
                    BatchWait     1s
                    BatchSize     1048576
                    Timeout       10s
                    Proxy         Off
                    Tls           Off
                    Tls.Verify    Off
                    Tls.Debug     1
                    Http_User     
                    Http_Passwd   
                    
        # HTTP plugin example
        out_http:
            - name: HTTP Output Example
            - config: |
                [OUTPUT]
                    Name          http
                    Match         *
                    Host          localhost
                    Port          8080
                    Uri           /logs
                    Format        json
                    Header        Content-Type application/json
                    Http_User     
                    Http_Passwd   
                    
        # File plugin example
        out_file:
            - name: File Output Example
            - config: |
                [OUTPUT]
                    Name          file
                    Match         *
                    Path          /var/log/fluent-bit/aggregated.log
                    Format        json_lines
                    
        # Stdout plugin example
        out_stdout:
            - name: Stdout Output Example
            - config: |
                [OUTPUT]
                    Name          stdout
                    Match         *
                    Format        json_lines
                    
        # Systemd plugin example
        in_systemd:
            - name: Systemd Input Example
            - config: |
                [INPUT]
                    Name              systemd
                    Tag               system.journal
                    Path              /var/log/journal
                    DB                /var/log/fluent-bit/journal.db
                    Mem_Buf_Limit     5MB
                    Systemd_Filter    _SYSTEMD_UNIT=xvpn-api.service
                    Systemd_Filter    _SYSTEMD_UNIT=xvpn-agent.service
                    Systemd_Filter    _SYSTEMD_UNIT=xvpn-bot.service
                    Systemd_Filter    _SYSTEMD_UNIT=xvpn-worker.service
                    Systemd_Filter    _SYSTEMD_UNIT=xvpn-orchestrator.service
                    Systemd_Filter    _SYSTEMD_UNIT=xvpn-core.service
                    
        # Tail plugin example
        in_tail:
            - name: Tail Input Example
            - config: |
                [INPUT]
                    Name              tail
                    Path              /var/log/xvpn/*.log
                    Parser            json
                    Tag               xvpn.*
                    Refresh_Interval  5
                    Read_from_Head    true
                    Buffer_Chunk_Size 32k
                    Buffer_Max_Size   256k
                    Skip_Long_Lines   On
                    DB                /var/log/fluent-bit/xvpn.db
                    Mem_Buf_Limit     5MB
                    
        # Record modifier filter example
        filter_record_modifier:
            - name: Record Modifier Filter Example
            - config: |
                [FILTER]
                    Name          record_modifier
                    Match         xvpn.*
                    Record        hostname ${HOSTNAME}
                    Record        service ${TAG[1]}
                    Record        timestamp ${time.strftime('%Y-%m-%dT%H:%M:%S.%NZ')}
                    
        # JSON parser example
        parser_json:
            - name: JSON Parser Example
            - config: |
                [PARSER]
                    Name        json
                    Format      json
                    Time_Key    timestamp
                    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
                    Time_Keep   On