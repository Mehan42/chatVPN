# XVPN Jaeger Configuration
# Конфигурация системы распределённого трассирования Jaeger

# === Global Configuration ===
global:
  # Check for new version
  check_new_version: true
  
  # Send anonymous usage data
  send_anonymous_usage: false

# === Server Configuration ===
server:
  # HTTP server listen port
  http_port: 16686
  
  # gRPC server listen port
  grpc_port: 16687
  
  # Server graceful shutdown timeout
  graceful_shutdown_timeout: 30s

# === Collector Configuration ===
collector:
  # Collector zipkin HTTP port
  zipkin_http_port: 9411
  
  # Collector HTTP port
  http_port: 14268
  
  # Collector gRPC port
  grpc_port: 14250
  
  # Collector health check HTTP port
  health_check_http_port: 14269
  
  # Collector queue size
  queue_size: 2000
  
  # Collector number of workers
  num_workers: 50
  
  # Collector max packet size
  max_packet_size: 65000

# === Agent Configuration ===
agent:
  # Agent reporting host port
  reporter:
    # Agent reporter type
    type: grpc
    
    # Agent reporter host port
    host_port: jaeger-collector:14250
    
    # Agent reporter queue size
    queue_size: 1000
    
    # Agent reporter max packet size
    max_packet_size: 65000
    
    # Agent reporter flush interval
    flush_interval: 1s
    
    # Agent reporter log spam
    log_spam: false

# === Query Configuration ===
query:
  # Query grpc host port
  grpc_host_port: jaeger-query:16687
  
  # Query health check HTTP port
  health_check_http_port: 16687
  
  # Query base path
  base_path: /
  
  # Query static files
  static_files: /go/bin/query-static

# === Storage Configuration ===
storage:
  # Storage type
  type: badger
  
  # Badger storage configuration
  badger:
    # Badger ephemeral (in-memory storage)
    ephemeral: false
    
    # Badger directory for data
    directory_value: /badger/data
    
    # Badger directory for keys
    directory_key: /badger/key
    
    # Badger read only mode
    read_only: false
    
    # Badger truncate corrupted data
    truncate: true
    
    # Badger sync writes
    sync_writes: true
    
    # Badger compression
    compression: snappy
    
    # Badger encryption key
    encryption_key: ""
    
    # Badger block cache size
    block_cache_size: 0
    
    # Badger index cache size
    index_cache_size: 0
    
    # Badger namespace mode
    namespace_mode: ""
    
    # Badger namespace permissions
    namespace_permissions: ""
    
    # Badger memory map
    memory_map: true
    
    # Badger num level zero tables
    num_level_zero_tables: 5
    
    # Badger num level zero tables stale
    num_level_zero_tables_stale: 10
    
    # Badger level size multiplier
    level_size_multiplier: 10
    
    # Badger max levels
    max_levels: 7
    
    # Badger value threshold
    value_threshold: 1048576
    
    # Badger num memtables
    num_memtables: 5
    
    # Badger bloom false positive rate
    bloom_false_positive: 0.01
    
    # Badger block size
    block_size: 4096
    
    # Badger sync writes
    sync_writes: true
    
    # Badger num go routines
    num_go_routines: 8
    
    # Badger ratio zlib compression
    ratio_zstd_compression: 0
    
    # Badger discard ratio
    discard_ratio: 0.95
    
    # Badger read only
    read_only: false
    
    # Badger truncate
    truncate: true
    
    # Badger in memory
    in_memory: false
    
    # Badger metrics enabled
    metrics_enabled: true
    
    # Badger logging level
    logging_level: info
    
    # Badger cache size
    cache_size: 0
    
    # Badger index cache size
    index_cache_size: 0

# === Cassandra Storage Configuration ===
cassandra:
  # Cassandra servers
  servers: cassandra:9042
  
  # Cassandra keyspace
  keyspace: jaeger_v1_dc1
  
  # Cassandra username
  username: ""
  
  # Cassandra password
  password: ""
  
  # Cassandra TLS configuration
  tls:
    # Enable TLS
    enabled: false
    
    # Skip TLS verification
    skip_host_verify: false
    
    # Certificate authority file
    ca_file: ""
    
    # Certificate file
    cert_file: ""
    
    # Key file
    key_file: ""
    
    # Server name
    server_name: ""
    
    # Cipher suites
    cipher_suites: []
    
    # Minimum TLS version
    min_version: ""
    
    # Maximum TLS version
    max_version: ""
    
    # Prefer server cipher suites
    prefer_server_cipher_suites: false
    
    # Session tickets
    session_tickets: true

# === Elasticsearch Storage Configuration ===
elasticsearch:
  # Elasticsearch servers
  server_urls: http://elasticsearch:9200
  
  # Elasticsearch username
  username: ""
  
  # Elasticsearch password
  password: ""
  
  # Elasticsearch token
  token: ""
  
  # Elasticsearch TLS configuration
  tls:
    # Enable TLS
    enabled: false
    
    # Skip TLS verification
    skip_host_verify: false
    
    # Certificate authority file
    ca_file: ""
    
    # Certificate file
    cert_file: ""
    
    # Key file
    key_file: ""
    
    # Server name
    server_name: ""
    
    # Cipher suites
    cipher_suites: []
    
    # Minimum TLS version
    min_version: ""
    
    # Maximum TLS version
    max_version: ""
    
    # Prefer server cipher suites
    prefer_server_cipher_suites: false
    
    # Session tickets
    session_tickets: true

# === Kafka Storage Configuration ===
kafka:
  # Kafka brokers
  brokers: kafka:9092
  
  # Kafka topic
  topic: jaeger-spans
  
  # Kafka producer configuration
  producer:
    # Producer TLS configuration
    tls:
      # Enable TLS
      enabled: false
      
      # Skip TLS verification
      skip_host_verify: false
      
      # Certificate authority file
      ca_file: ""
      
      # Certificate file
      cert_file: ""
      
      # Key file
      key_file: ""
      
      # Server name
      server_name: ""
      
      # Cipher suites
      cipher_suites: []
      
      # Minimum TLS version
      min_version: ""
      
      # Maximum TLS version
      max_version: ""
      
      # Prefer server cipher suites
      prefer_server_cipher_suites: false
      
      # Session tickets
      session_tickets: true

# === Sampling Configuration ===
sampling:
  # Sampling strategies file
  strategies_file: /etc/jaeger/sampling.json
  
  # Sampling refresh interval
  refresh_interval: 5s

# === Metrics Configuration ===
metrics:
  # Metrics backend
  backend: prometheus
  
  # Metrics HTTP route
  http_route: /metrics
  
  # Metrics HTTP port
  http_port: 14269

# === Tracing Configuration ===
tracing:
  # Enable tracing
  enabled: true
  
  # Tracing provider
  provider: jaeger
  
  # Jaeger configuration
  jaeger:
    # Sampling server URL
    sampling_server_url: http://jaeger:5778/sampling
    
    # Local agent host port
    local_agent_host_port: jaeger:6831
    
    # Service name
    service_name: jaeger

# === Logging Configuration ===
log:
  # Log level
  level: info
  
  # Log format
  format: logfmt
  
  # Log file
  file: /var/log/jaeger/jaeger.log

# === UI Configuration ===
ui:
  # Base path for UI
  base_path: /
  
  # Static files path
  static_files: /go/bin/query-static

# === Health Check Configuration ===
health_check:
  # Health check HTTP port
  http_port: 14269

