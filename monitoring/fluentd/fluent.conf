# XVPN Fluentd Configuration
# Конфигурация системы агрегации логов Fluentd

# === System Configuration ===
system:
  # Root directory for fluentd
  root_dir: /var/lib/fluentd
  
  # Log level
  log_level: info
  
  # Log format
  log_format: json
  
  # Log file
  log_file: /var/log/fluentd/fluentd.log
  
  # Process name
  process_name: fluentd
  
  # Daemonize
  daemonize: true
  
  # Pid file
  pid_file: /var/run/fluentd/fluentd.pid

# === Source Configuration ===
<source>
  # === XVPN API Logs ===
  @type tail
  @id xvpn_api_logs
  path /var/log/xvpn/api.log
  pos_file /var/log/xvpn/.fluentd_api.pos
  tag xvpn.api
  format json
  time_key timestamp
  time_format %Y-%m-%dT%H:%M:%S.%NZ
  read_from_head true
</source>

