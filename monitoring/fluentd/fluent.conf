<source>
  # === System Logs ===
  @type tail
  @id system_logs
  path /var/log/syslog
  pos_file /var/log/.fluentd_syslog.pos
  tag system.syslog
  format /^(?<time>[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$/
  time_format %b %d %H:%M:%S
  read_from_head true
</source>

<source>
  # === Journal Logs ===
  @type systemd
  @id journal_logs
  tag system.journal
  path /var/log/journal
  matches [{ "_SYSTEMD_UNIT": "xvpn-api.service" }, { "_SYSTEMD_UNIT": "xvpn-agent.service" }, { "_SYSTEMD_UNIT": "xvpn-bot.service" }, { "_SYSTEMD_UNIT": "xvpn-worker.service" }, { "_SYSTEMD_UNIT": "xvpn-orchestrator.service" }, { "_SYSTEMD_UNIT": "xvpn-core.service" }]
  read_from_head true
</source>

# === Filter Configuration ===
<filter xvpn.**>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    service ${tag_parts[1]}
    timestamp ${time.strftime('%Y-%m-%dT%H:%M:%S.%NZ')}
  </record>
</filter>

<filter system.**>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    timestamp ${time.strftime('%Y-%m-%dT%H:%M:%S.%NZ')}
  </record>
</filter>

# === Match Configuration ===
<match xvpn.api>
  @type loki
  url http://loki:3100/loki/api/v1/push
  tenant ""
  <label>
    job xvpn-api
    service api
    hostname ${hostname}
  </label>
  <buffer>
    flush_interval 10s
    chunk_limit_size 1mb
    flush_at_shutdown true
  </buffer>
</match>

