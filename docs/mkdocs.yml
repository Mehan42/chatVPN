# XVPN Documentation Configuration
# Конфигурация автоматической генерации документации

# === MkDocs Configuration ===
site_name: XVPN Documentation
site_url: https://docs.xvpn.local
site_description: Complete documentation for XVPN - Intelligent VPN with AI Agents
site_author: XVPN Team

# Тема документации
theme:
  name: material
  language: en
  palette:
    # Темная тема по умолчанию
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Светлая тема
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate

# Плагины
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
  - autorefs
  - git-revision-date-localized:
      enable_creation_date: true
  - minify:
      minify_html: true
  - redirects:
      redirect_maps:
        'old/page.md': 'new/page.md'

# Расширения Markdown
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - toc:
      permalink: true

# Навигация
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Configuration: getting-started/configuration.md
      - First Steps: getting-started/first-steps.md
  - User Guide:
      - Basic Usage: user-guide/basic-usage.md
      - Advanced Features: user-guide/advanced-features.md
      - Security: user-guide/security.md
      - Troubleshooting: user-guide/troubleshooting.md
      - FAQ: user-guide/faq.md
  - Administrator Guide:
      - Server Installation: admin-guide/server-installation.md
      - Configuration: admin-guide/configuration.md
      - Monitoring: admin-guide/monitoring.md
      - Maintenance: admin-guide/maintenance.md
      - Security: admin-guide/security.md
      - Backup and Restore: admin-guide/backup-restore.md
  - Developer Guide:
      - Architecture: developer-guide/architecture.md
      - API Reference: developer-guide/api-reference.md
      - Contributing: developer-guide/contributing.md
      - Testing: developer-guide/testing.md
      - Building from Source: developer-guide/building.md
  - API Documentation:
      - REST API: api/rest-api.md
      - WebSocket API: api/websocket-api.md
      - Internal API: api/internal-api.md
  - Changelog: changelog.md
  - License: license.md

# Каталог с документацией
docs_dir: docs

# Каталог для сборки
site_dir: site

# Файлы для исключения
exclude_docs: |
  /templates/
  /snippets/
  /drafts/

# Дополнительные файлы
extra:
  version:
    provider: mike
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mehan42/chatVPN
    - icon: fontawesome/brands/telegram
      link: https://t.me/xvpn_community
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/xvpn

