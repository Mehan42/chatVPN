# XVPN System Monitoring Configuration
# Конфигурация системного мониторинга

# === Global Configuration ===
global:
  # Enable global monitoring
  enabled: true
  
  # Monitoring interval
  interval: 15s
  
  # Monitoring timeout
  timeout: 10s
  
  # Monitoring retries
  retries: 3

# === System Metrics ===
system:
  # CPU metrics
  cpu:
    # Enable CPU monitoring
    enabled: true
    
    # CPU metrics interval
    interval: 15s
    
    # CPU metrics timeout
    timeout: 10s
    
    # CPU metrics retries
    retries: 3
    
    # CPU metrics path
    path: /metrics/cpu
    
    # CPU metrics format
    format: json
    
    # CPU metrics file
    file: /var/log/xvpn/metrics/cpu.json
    
    # CPU metrics retention
    retention: 7d
    
    # CPU metrics aggregation
    aggregation: true
    
    # CPU metrics alerting
    alerting: true
    
    # CPU metrics thresholds
    thresholds:
      # CPU usage threshold
      usage: 80
      
      # CPU temperature threshold
      temperature: 85
      
      # CPU frequency threshold
      frequency: 3.5
      
      # CPU load average threshold
      load_average: 1.5
      
      # CPU steal time threshold
      steal_time: 5
      
      # CPU iowait threshold
      iowait: 10
      
      # CPU softirq threshold
      softirq: 5
      
      # CPU guest threshold
      guest: 5
      
      # CPU nice threshold
      nice: 5
      
      # CPU system threshold
      system: 5
      
      # CPU user threshold
      user: 5
      
      # CPU idle threshold
      idle: 5
      
      # CPU irq threshold
      irq: 5
      
      # CPU softirq threshold
      softirq: 5
      
      # CPU steal threshold
      steal: 5
      
      # CPU guest_nice threshold
      guest_nice: 5
      
      # CPU context switches threshold
      context_switches: 10000
      
      # CPU interrupts threshold
      interrupts: 10000
      
      # CPU soft interrupts threshold
      soft_interrupts: 10000
      
      # CPU syscalls threshold
      syscalls: 10000

  # Memory metrics
  memory:
    # Enable memory monitoring
    enabled: true
    
    # Memory metrics interval
    interval: 15s
    
    # Memory metrics timeout
    timeout: 10s
    
    # Memory metrics retries
    retries: 3
    
    # Memory metrics path
    path: /metrics/memory
    
    # Memory metrics format
    format: json
    
    # Memory metrics file
    file: /var/log/xvpn/metrics/memory.json
    
    # Memory metrics retention
    retention: 7d
    
    # Memory metrics aggregation
    aggregation: true
    
    # Memory metrics alerting
    alerting: true
    
    # Memory metrics thresholds
    thresholds:
      # Memory usage threshold
      usage: 85
      
      # Memory available threshold
      available: 15
      
      # Memory swap usage threshold
      swap_usage: 50
      
      # Memory swap in threshold
      swap_in: 1000
      
      # Memory swap out threshold
      swap_out: 1000
      
      # Memory page faults threshold
      page_faults: 1000
      
      # Memory major page faults threshold
      major_page_faults: 100
      
      # Memory page ins threshold
      page_ins: 1000
      
      # Memory page outs threshold
      page_outs: 1000
      
      # Memory page dirty threshold
      page_dirty: 1000
      
      # Memory page clean threshold
      page_clean: 1000
      
      # Memory page activate threshold
      page_activate: 1000
      
      # Memory page deactivate threshold
      page_deactivate: 1000
      
      # Memory page steal threshold
      page_steal: 1000
      
      # Memory page scan threshold
      page_scan: 1000
      
      # Memory page refill threshold
      page_refill: 1000
      
      # Memory page reclaim threshold
      page_reclaim: 1000
      
      # Memory page migrate threshold
      page_migrate: 1000
      
      # Memory page compact threshold
      page_compact: 1000
      
      # Memory page split threshold
      page_split: 1000
      
      # Memory page merge threshold
      page_merge: 1000

  # Disk metrics
  disk:
    # Enable disk monitoring
    enabled: true
    
    # Disk metrics interval
    interval: 30s
    
    # Disk metrics timeout
    timeout: 15s
    
    # Disk metrics retries
    retries: 3
    
    # Disk metrics path
    path: /metrics/disk
    
    # Disk metrics format
    format: json
    
    # Disk metrics file
    file: /var/log/xvpn/metrics/disk.json
    
    # Disk metrics retention
    retention: 7d
    
    # Disk metrics aggregation
    aggregation: true
    
    # Disk metrics alerting
    alerting: true
    
    # Disk metrics thresholds
    thresholds:
      # Disk usage threshold
      usage: 90
      
      # Disk inodes usage threshold
      inodes_usage: 95
      
      # Disk read bytes threshold
      read_bytes: 104857600  # 100MB/s
      
      # Disk write bytes threshold
      write_bytes: 104857600  # 100MB/s
      
      # Disk read operations threshold
      read_operations: 1000
      
      # Disk write operations threshold
      write_operations: 1000
      
      # Disk read time threshold
      read_time: 1000
      
      # Disk write time threshold
      write_time: 1000
      
      # Disk io time threshold
      io_time: 1000
      
      # Disk weighted io time threshold
      weighted_io_time: 1000
      
      # Disk sectors read threshold
      sectors_read: 204800  # 100MB/s
      
      # Disk sectors written threshold
      sectors_written: 204800  # 100MB/s
      
      # Disk io in progress threshold
      io_in_progress: 100
      
      # Disk io merged read threshold
      io_merged_read: 1000
      
      # Disk io merged write threshold
      io_merged_write: 1000

  # Network metrics
  network:
    # Enable network monitoring
    enabled: true
    
    # Network metrics interval
    interval: 15s
    
    # Network metrics timeout
    timeout: 10s
    
    # Network metrics retries
    retries: 3
    
    # Network metrics path
    path: /metrics/network
    
    # Network metrics format
    format: json
    
    # Network metrics file
    file: /var/log/xvpn/metrics/network.json
    
    # Network metrics retention
    retention: 7d
    
    # Network metrics aggregation
    aggregation: true
    
    # Network metrics alerting
    alerting: true
    
    # Network metrics thresholds
    thresholds:
      # Network bytes sent threshold
      bytes_sent: 10485760  # 10MB/s
      
      # Network bytes received threshold
      bytes_received: 10485760  # 10MB/s
      
      # Network packets sent threshold
      packets_sent: 10000
      
      # Network packets received threshold
      packets_received: 10000
      
      # Network errors in threshold
      errors_in: 100
      
      # Network errors out threshold
      errors_out: 100
      
      # Network drops in threshold
      drops_in: 100
      
      # Network drops out threshold
      drops_out: 100
      
      # Network collisions threshold
      collisions: 10
      
      # Network multicast threshold
      multicast: 10000
      
      # Network compressed in threshold
      compressed_in: 1000
      
      # Network compressed out threshold
      compressed_out: 1000
      
      # Network fifo in threshold
      fifo_in: 100
      
      # Network fifo out threshold
      fifo_out: 100
      
      # Network frame threshold
      frame: 100
      
      # Network carrier threshold
      carrier: 100
      
      # Network txqueuelen threshold
      txqueuelen: 1000
      
      # Network speed threshold
      speed: 1000000000  # 1Gbps
      
      # Network duplex threshold
      duplex: full
      
      # Network autoneg threshold
      autoneg: true

