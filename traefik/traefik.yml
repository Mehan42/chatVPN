# XVPN Traefik Configuration
# Конфигурация Traefik для reverse proxy и load balancer

# === Global Configuration ===
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# === Entry Points Configuration ===
entryPoints:
  # === Web Entry Point (HTTP) ===
  web:
    address: ":80"
    http:
      # Redirect all HTTP traffic to HTTPS
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
          
  # === Web Secure Entry Point (HTTPS) ===
  websecure:
    address: ":443"
    http:
      # TLS configuration
      tls:
        # Enable TLS
        enabled: true
        
        # Certificate resolver
        certResolver: le
        
        # TLS options
        options: 
          minVersion: VersionTLS13
          cipherSuites:
            - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
            - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
            - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
            - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
            - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
            - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
          curvePreferences:
            - CurveP521
            - CurveP384
            - CurveP256
          preferServerCipherSuites: true
          sessionTickets:
            enabled: true
          alpnProtocols:
            - h2
            - http/1.1
          renegotiationSupport: NoRenegotiation
          
      # Middlewares
      middlewares:
        - security-headers
        - rate-limit
        - compress
        
  # === XVPN API Entry Point ===
  xvpn:
    address: ":8443"
    http:
      # TLS configuration
      tls:
        # Enable TLS
        enabled: true
        
        # Certificate resolver
        certResolver: le
        
        # TLS options
        options: 
          minVersion: VersionTLS13
          cipherSuites:
            - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
            - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
            - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
            - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
            - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
            - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
          curvePreferences:
            - CurveP521
            - CurveP384
            - CurveP256
          preferServerCipherSuites: true
          sessionTickets:
            enabled: true
          alpnProtocols:
            - h2
            - http/1.1
          renegotiationSupport: NoRenegotiation
          
      # Middlewares
      middlewares:
        - security-headers
        - rate-limit
        - compress
        
  # === Traefik Dashboard Entry Point ===
  traefik:
    address: ":8080"
    http:
      # Middlewares
      middlewares:
        - auth
        - security-headers

# === Providers Configuration ===
providers:
  # === Docker Provider ===
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true
    network: xvpn-network
    constraints: 
      - "Label(`traefik.enable`, `true`)"
      
  # === File Provider ===
  file:
    watch: true
    directory: /etc/traefik/dynamic
    filename: /etc/traefik/tls.yml

# === API Configuration ===
api:
  dashboard: true
  insecure: false
  debug: false

# === Logging Configuration ===
log:
  level: INFO
  format: json
  filePath: /var/log/traefik/traefik.log

# === Access Logs Configuration ===
accessLog:
  enabled: true
  format: json
  filePath: /var/log/traefik/access.log
  bufferingSize: 100
  filters:
    statusCodes:
      - "200"
      - "404"
      - "500"
      - "502"
      - "503"
      - "504"

# === Tracing Configuration ===
tracing:
  jaeger:
    samplingServerURL: http://jaeger:5778/sampling
    localAgentHostPort: jaeger:6831
    serviceName: traefik

# === Metrics Configuration ===
metrics:
  prometheus:
    enable: true
    entryPoint: metrics
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

# === Certificate Resolvers Configuration ===
certificatesResolvers:
  # === Let's Encrypt Resolver ===
  le:
    acme:
      email: admin@xvpn.local
      storage: /letsencrypt/acme.json
      tlsChallenge: {}
      httpChallenge:
        entryPoint: web
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 0
        disablePropagationCheck: false
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

# === Pilot Configuration ===
pilot:
  token: your-traefik-pilot-token

# === Experimental Features Configuration ===
experimental:
  plugins:
    enabled: true
  http3:
    enabled: true

# === Additional Arguments Configuration ===
additionalArguments:
  - "--providers.docker.constraints=Label(`traefik.constraint-label`,`xvpn`)"
  - "--providers.docker.watch=true"
  - "--providers.file.directory=/etc/traefik/dynamic"
  - "--providers.file.watch=true"
  - "--log.level=INFO"
  - "--accesslog=true"
  - "--accesslog.format=json"
  - "--accesslog.filepath=/var/log/traefik/access.log"
  - "--tracing.jaeger=true"
  - "--tracing.jaeger.samplingServerURL=http://jaeger:5778/sampling"
  - "--tracing.jaeger.localAgentHostPort=jaeger:6831"
  - "--tracing.jaeger.serviceName=traefik"
  - "--metrics.prometheus=true"
  - "--metrics.prometheus.entryPoint=metrics"
  - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
  - "--certificatesresolvers.le.acme.tlschallenge=true"
  - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
  - "--certificatesresolvers.le.acme.dnschallenge.provider=cloudflare"
  - "--certificatesresolvers.le.acme.dnschallenge.delayBeforeCheck=0"
  - "--certificatesresolvers.le.acme.dnschallenge.disablePropagationCheck=false"
  - "--certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
  - "--pilot.token=your-traefik-pilot-token"
  - "--experimental.plugins.enabled=true"
  - "--experimental.http3.enabled=true"
  - "--api.dashboard=true"
  - "--api.insecure=false"
  - "--api.debug=false"
  - "--log.format=json"
  - "--log.filepath=/var/log/traefik/traefik.log"
  - "--accesslog.bufferingsize=100"
  - "--accesslog.filters.statuscodes=200,404,500,502,503,504"