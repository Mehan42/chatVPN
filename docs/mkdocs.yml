# === Конфигурация автоматической генерации ===
# docs/.readthedocs.yaml

# Версия конфигурации
version: 2

# Сборка
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    pre_build:
      - pip install -r docs/requirements.txt
      - mkdocs build

# Форматы вывода
formats:
  - pdf
  - epub

# Python конфигурация
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

# Уведомления
notifications:
  email:
    on_success: change
    on_failure: always
  slack:
    webhook_url: ${{ secrets.SLACK_WEBHOOK }}
    channel: "#documentation"

# === Конфигурация API документации ===
# docs/openapi.yaml

openapi: 3.0.0
info:
  title: XVPN API
  description: REST API for XVPN - Intelligent VPN with AI Agents
  version: 1.0.0
  contact:
    name: XVPN Team
    email: team@xvpn.local
    url: https://github.com/Mehan42/chatVPN
  license:
    name: MIT
    url: https://github.com/Mehan42/chatVPN/blob/main/LICENSE

servers:
  - url: https://api.xvpn.local
    description: Production server
  - url: https://staging.api.xvpn.local
    description: Staging server
  - url: http://localhost:8443
    description: Development server

# Пути API
paths:
  /mcp/v1/vpn.health:
    get:
      summary: Get VPN health status
      description: Returns current VPN health status and mask score
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          description: Internal server error
          
  /transports/manifest.json:
    get:
      summary: Get transport manifest
      description: Returns available transport protocols manifest
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportManifest'
        '500':
          description: Internal server error
          
  /clients/{uuid}.json:
    get:
      summary: Get client configuration
      description: Returns client configuration by UUID
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
        '404':
          description: Client not found
        '500':
          description: Internal server error

# Компоненты схем
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, warning, critical]
        mask_score:
          type: integer
          minimum: 0
          maximum: 5
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          
    TransportManifest:
      type: object
      properties:
        version:
          type: integer
        transports:
          type: array
          items:
            $ref: '#/components/schemas/Transport'
            
    Transport:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        priority:
          type: integer
        ipv6:
          type: boolean
        need_udp:
          type: boolean
        config:
          type: object
          
    ClientConfig:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        transports:
          type: array
          items:
            $ref: '#/components/schemas/Transport'
        settings:
          type: object

# === Конфигурация автоматического развертывания ===
# .github/workflows/documentation.yml

name: Documentation Deployment

on:
  push:
    branches:
      - main
      - docs/**
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "LICENSE"
      
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "LICENSE"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
          
      - name: Build documentation
        run: |
          mkdocs build
          
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: docs.xvpn.local
          
      - name: Deploy to Read the Docs
        if: github.ref == 'refs/heads/main'
        run: |
          # TODO: Add Read the Docs deployment commands
          
      - name: Notify on success
        if: success()
        run: |
          echo "Documentation deployed successfully!"
          
      - name: Notify on failure
        if: failure()
        run: |
          echo "Documentation deployment failed!"