# XVPN Security Monitoring Configuration
# Конфигурация автоматического мониторинга безопасности

# === Global Configuration ===
global:
  # Enable global security monitoring
  enabled: true
  
  # Security monitoring interval
  interval: 60s
  
  # Security monitoring timeout
  timeout: 30s
  
  # Security monitoring retries
  retries: 3
  
  # Security monitoring path
  path: /security
  
  # Security monitoring format
  format: json
  
  # Security monitoring file
  file: /var/log/xvpn/security/security.log
  
  # Security monitoring retention
  retention: 30d
  
  # Security monitoring aggregation
  aggregation: true
  
  # Security monitoring alerting
  alerting: true

# === Vulnerability Scanning ===
vulnerability_scanning:
  # Enable vulnerability scanning
  enabled: true
  
  # Vulnerability scanning interval
  interval: 24h
  
  # Vulnerability scanning timeout
  timeout: 60s
  
  # Vulnerability scanning retries
  retries: 3
  
  # Vulnerability scanning path
  path: /security/vulnerability
  
  # Vulnerability scanning format
  format: json
  
  # Vulnerability scanning file
  file: /var/log/xvpn/security/vulnerability.log
  
  # Vulnerability scanning retention
  retention: 30d
  
  # Vulnerability scanning aggregation
  aggregation: true
  
  # Vulnerability scanning alerting
  alerting: true
  
  # Vulnerability scanning thresholds
  thresholds:
    # Critical vulnerability threshold
    critical: 0
    
    # High vulnerability threshold
    high: 5
    
    # Medium vulnerability threshold
    medium: 20
    
    # Low vulnerability threshold
    low: 50
    
    # Unknown vulnerability threshold
    unknown: 100

