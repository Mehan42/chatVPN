# XVPN Docker Compose Configuration with Traefik and uv
# Version: 1.0
# Author: XVPN Team
# Description: Production-ready Docker setup with uv package manager and Traefik load balancer

version: '3.8'

# Включаем Traefik как основной reverse proxy и load balancer
services:
  # === Traefik Load Balancer ===
  traefik:
    image: traefik:v2.10
    container_name: xvpn-traefik
    command:
      # Включаем API для мониторинга
      - "--api.insecure=true"
      # Включаем Docker provider для автоматической discovery сервисов
      - "--providers.docker=true"
      # Включаем Docker Swarm provider для оркестрации
      - "--providers.docker.exposedbydefault=false"
      # Определяем точки входа
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443" 
      - "--entrypoints.xvpn.address=:8443"
      # Включаем автоматические SSL сертификаты
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=letsencrypt@xvpn.local"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      # HTTP порт
      - "80:80"
      # HTTPS порт
      - "443:443"
      # XVPN API порт (внутренний)
      - "8443:8443"
      # Traefik Dashboard (для мониторинга)
      - "8080:8080"
    volumes:
      # Доступ к Docker socket для автоматического discovery сервисов
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # Хранилище для SSL сертификатов
      - "./traefik/letsencrypt:/letsencrypt"
      # Конфигурационные файлы Traefik
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      # Включаем Traefik dashboard
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.xvpn.local`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  # === XVPN API Service ===
  xvpn-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        # Аргументы для оптимизации сборки
        - UV_CACHE_DIR=/tmp/uv-cache
        - PYTHON_VERSION=3.11
    container_name: xvpn-api
    command: uvx run --app api.main:app
    environment:
      # Environment variables для Flask API
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////data/xvpn.db
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - XVPN_CONFIG_FILE=/config/api.json
    volumes:
      # Персистентное хранение данных
      - xvpn-data:/data
      - ./config:/config:ro
      # Кэш uv для ускорения последующих сборок
      - uv-cache:/tmp/uv-cache
    networks:
      - xvpn-network
    restart: unless-stopped
    depends_on:
      - redis
    labels:
      # Traefik конфигурация для API
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.xvpn.local`) || PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.services.api.loadbalancer.server.port=8443"
      - "traefik.http.middlewares.api-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.middlewares=api-stripprefix"
      # Health check
      - "traefik.http.routers.api.rule=Host(`api.xvpn.local`) || PathPrefix(`/api`) || PathPrefix(`/mcp`)"
      # Метрики для мониторинга
      - "traefik.http.routers.api.priority=10"

  # === XVPN Agent Service ===
  xvpn-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
      args:
        - UV_CACHE_DIR=/tmp/uv-cache
        - PYTHON_VERSION=3.11
    container_name: xvpn-agent
    command: uvx run --app agent.main:agent
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////data/agent.db
      - MANIFEST_URL=http://xvpn-api:8443/transports/manifest.json
      - HEALTH_URL=http://xvpn-api:8443/mcp/v1/vpn.health
      - AGENT_CONFIG_FILE=/config/agent.json
    volumes:
      - xvpn-data:/data
      - ./config:/config:ro
      - uv-cache:/tmp/uv-cache
      # База знаний агента
      - ./server/agent/knowledge:/app/agent/knowledge:ro
    networks:
      - xvpn-network
    restart: unless-stopped
    depends_on:
      - xvpn-api
      - redis
    labels:
      # Traefik конфигурация для агента
      - "traefik.enable=true"
      - "traefik.http.routers.agent.rule=PathPrefix(`/agent`)"
      - "traefik.http.routers.agent.entrypoints=websecure"
      - "traefik.http.routers.agent.tls.certresolver=myresolver"
      - "traefik.http.services.agent.loadbalancer.server.port=8443"
      - "traefik.http.middlewares.agent-stripprefix.stripprefix.prefixes=/agent"
      - "traefik.http.routers.agent.middlewares=agent-stripprefix"
      # Health check
      - "traefik.http.routers.agent.priority=20"

  # === XVPN Bot Service ===
  xvpn-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
      args:
        - UV_CACHE_DIR=/tmp/uv-cache
        - PYTHON_VERSION=3.11
    container_name: xvpn-bot
    command: uvx run --app bot.main:bot
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - API_BASE_URL=https://api.xvpn.local
      - BOT_CONFIG_FILE=/config/bot.json
    volumes:
      - ./config:/config:ro
      - uv-cache:/tmp/uv-cache
    networks:
      - xvpn-network
    restart: unless-stopped
    depends_on:
      - xvpn-api
    labels:
      # Traefik конфигурация для бота
      - "traefik.enable=true"
      - "traefik.http.routers.bot.rule=Host(`bot.xvpn.local`)"
      - "traefik.http.routers.bot.entrypoints=websecure"
      - "traefik.http.routers.bot.tls.certresolver=myresolver"
      - "traefik.http.services.bot.loadbalancer.server.port=8443"
      # Health check
      - "traefik.http.routers.bot.priority=30"

  # === XVPN Worker Service (для фоновых задач) ===
  xvpn-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        - UV_CACHE_DIR=/tmp/uv-cache
        - PYTHON_VERSION=3.11
    container_name: xvpn-worker
    command: uvx run --app worker.main:worker
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - WORKER_COUNT=2
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - xvpn-data:/data
      - ./config:/config:ro
      - uv-cache:/tmp/uv-cache
    networks:
      - xvpn-network
    restart: unless-stopped
    depends_on:
      - redis
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # === Redis Cache ===
  redis:
    image: redis:7-alpine
    container_name: xvpn-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
      - ./config/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      - "traefik.enable=false"  # Redis не доступен через Traefik

  # === PostgreSQL Database (альтернатива SQLite) ===
  postgres:
    image: postgres:15-alpine
    container_name: xvpn-postgres
    environment:
      - POSTGRES_DB=xvpn
      - POSTGRES_USER=xvpn
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # === XVPN Core VPN Service ===
  xvpn-core:
    image: teddysun/xray:latest
    container_name: xvpn-core
    command: xray run -c /config/xray.json
    volumes:
      - ./config/xray:/config:ro
      - xvpn-data:/data
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      # Traefik конфигурация для VPN ядра
      - "traefik.enable=true"
      - "traefik.http.routers.vpn.rule=Host(`vpn.xvpn.local`)"
      - "traefik.http.routers.vpn.entrypoints=websecure"
      - "traefik.http.routers.vpn.tls.certresolver=myresolver"
      - "traefik.http.services.vpn.loadbalancer.server.port=443"
      # Health check
      - "traefik.http.routers.vpn.priority=5"

  # === Monitoring and Logging ===
  grafana:
    image: grafana/grafana:latest
    container_name: xvpn-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.xvpn.local`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  prometheus:
    image: prom/prometheus:latest
    container_name: xvpn-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=200h'
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # === Monitoring Agent ===
  node-exporter:
    image: prom/node-exporter:latest
    container_name: xvpn-node-exporter
    command:
      - '--web.config.file=/etc/node-exporter/web.yml'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./monitoring/node-exporter/web.yml:/etc/node-exporter/web.yml:ro
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

# === Volumes для персистентного хранения ===
volumes:
  xvpn-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  uv-cache:
    driver: local

# === Сеть для взаимодействия сервисов ===
networks:
  xvpn-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# === Environment Variables ===
# Создайте .env файл в корне проекта со следующими переменными:
# BOT_TOKEN=ваш_токен_telegram_бота
# CHAT_ID=ваш_chat_id
# POSTGRES_PASSWORD=пароль_для_postgres
# GRAFANA_PASSWORD=пароль_для_grafana

# === Команды для использования ===
# Запуск всех сервисов
# docker-compose up -d

# Остановка всех сервисов
# docker-compose down

# Просмотр логов
# docker-compose logs -f [service_name]

# Обновление сервисов
# docker-compose pull && docker-compose up -d --force-recreate

# Очистка неиспользуемых volumes
# docker-compose down -v