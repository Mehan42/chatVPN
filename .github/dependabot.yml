# XVPN Dependabot Configuration
# Конфигурация автоматического обновления зависимостей

version: 2

updates:
  # === Python Dependencies ===
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "Mehan42"
      - "Avtandil42"
    assignees:
      - "Mehan42"
    labels:
      - "dependencies"
      - "python"
      - "automated-pr"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Игнорировать обновления, которые могут сломать совместимость
      - dependency-name: "flask"
        versions: ["3.x"]
      - dependency-name: "django"
        versions: ["4.x"]
      - dependency-name: "sqlalchemy"
        versions: ["2.x"]
    groups:
      # Группировать обновления по категориям
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  # === Docker Dependencies ===
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "Mehan42"
      - "Avtandil42"
    assignees:
      - "Mehan42"
    labels:
      - "dependencies"
      - "docker"
      - "automated-pr"
    commit-message:
      prefix: "docker"
    allow:
      - dependency-name: "python"
      - dependency-name: "alpine"
      - dependency-name: "debian"
      - dependency-name: "ubuntu"

  # === GitHub Actions Dependencies ===
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "Mehan42"
      - "Avtandil42"
    assignees:
      - "Mehan42"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated-pr"
    commit-message:
      prefix: "actions"

  # === NPM Dependencies (для веб-интерфейса, если будет) ===
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "Mehan42"
      - "Avtandil42"
    assignees:
      - "Mehan42"
    labels:
      - "dependencies"
      - "javascript"
      - "automated-pr"
    commit-message:
      prefix: "npm"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Игнорировать обновления крупных библиотек, которые могут сломать совместимость
      - dependency-name: "react"
        versions: ["18.x"]
      - dependency-name: "vue"
        versions: ["3.x"]
      - dependency-name: "@angular/*"
        versions: ["15.x", "16.x"]

# === Настройки по умолчанию ===
defaults:
  # Использовать GitHub Token для аутентификации
  registries:
    - github-actions
    - docker-hub
    - npm-registry
    - pypi-registry

# === Регистры ===
registries:
  # GitHub Actions
  github-actions:
    type: github-actions
    url: https://github.com
    token: ${{ secrets.GITHUB_TOKEN }}

  # Docker Hub
  docker-hub:
    type: docker-registry
    url: https://registry.hub.docker.com
    username: ${{ secrets.DOCKER_USERNAME }}
    password: ${{ secrets.DOCKER_PASSWORD }}

  # NPM Registry
  npm-registry:
    type: npm-registry
    url: https://registry.npmjs.org
    token: ${{ secrets.NPM_TOKEN }}

  # PyPI Registry
  pypi-registry:
    type: python-index
    url: https://pypi.org/simple/
    username: ${{ secrets.PYPI_USERNAME }}
    password: ${{ secrets.PYPI_PASSWORD }}

# === Настройки безопасности ===
security:
  # Проверять уязвимости в зависимостях
  check-dependencies: true
  
  # Автоматически обновлять уязвимые зависимости
  auto-update-vulnerable: true
  
  # Уведомлять о найденных уязвимостях
  vulnerability-notifications: true
  
  # Блокировать выпуск с уязвимостями
  block-release-with-vulnerabilities: true

# === Настройки интеграции ===
integrations:
  # Интеграция с GitHub
  github:
    enabled: true
    auto-sync: true
    auto-publish: true
    
  # Интеграция с Docker Hub
  docker-hub:
    enabled: true
    auto-publish: true
    repositories:
      - "mehan42/xvpn"
      - "mehan42/xvpn-api"
      - "mehan42/xvpn-agent"
      - "mehan42/xvpn-bot"
      - "mehan42/xvpn-worker"
      - "mehan42/xvpn-orchestrator"
      
  # Интеграция с PyPI
  pypi:
    enabled: true
    auto-publish: true
    packages:
      - "xvpn"
      
  # Интеграция с npm
  npm:
    enabled: false
    auto-publish: false
    
  # Интеграция с Maven Central
  maven-central:
    enabled: false
    auto-publish: false

# === Настройки мониторинга ===
monitoring:
  # Мониторить зависимости
  monitor-dependencies: true
  
  # Уведомлять об обновлениях
  notify-updates: true
  
  # Автоматически создавать PR для обновлений
  auto-create-pr: true
  
  # Автоматически мержить безопасные обновления
  auto-merge-safe: true
  
  # Проверять совместимость обновлений
  check-compatibility: true
  
  # Проверять производительность обновлений
  check-performance: true

# === Настройки уведомлений ===
notifications:
  # Уведомлять о новых версиях зависимостей
  dependency-updates: true
  
  # Уведомлять о найденных уязвимостях
  vulnerability-alerts: true
  
  # Уведомлять о заблокированных выпусках
  blocked-releases: true
  
  # Уведомлять о автоматических обновлениях
  auto-updates: true
  
  # Уведомлять о несовместимых обновлениях
  incompatible-updates: true
  
  # Уведомлять о производительности обновлений
  performance-impact: true

# === Настройки расписания ===
schedule:
  # Проверять зависимости еженедельно
  dependency-check: "0 9 * * 1"  # Каждый понедельник в 9:00 UTC
  
  # Проверять уязвимости ежедневно
  vulnerability-scan: "0 3 * * *"  # Каждый день в 3:00 UTC
  
  # Обновлять зависимости по расписанию
  dependency-update: "0 10 * * 1"  # Каждый понедельник в 10:00 UTC
  
  # Мониторить производительность еженедельно
  performance-monitoring: "0 11 * * 1"  # Каждый понедельник в 11:00 UTC

# === Настройки ограничений ===
constraints:
  # Ограничивать количество открытых PR
  max-open-prs: 20
  
  # Ограничивать количество обновлений в день
  max-daily-updates: 50
  
  # Ограничивать размер обновлений
  max-update-size: 100MB
  
  # Ограничивать время обновлений
  update-timeout: "2h"
  
  # Ограничивать попытки обновлений
  max-retry-attempts: 3
  
  # Ограничивать параллельные обновления
  max-parallel-updates: 5

# === Настройки резервного копирования ===
backup:
  # Резервировать зависимости перед обновлением
  backup-before-update: true
  
  # Резервировать конфигурацию перед обновлением
  backup-config-before-update: true
  
  # Резервировать данные перед обновлением
  backup-data-before-update: true
  
  # Хранить резервные копии
  keep-backups: 30  # дней
  
  # Сжимать резервные копии
  compress-backups: true
  
  # Шифровать резервные копии
  encrypt-backups: true

# === Настройки восстановления ===
restore:
  # Восстанавливать из резервной копии при сбое
  restore-on-failure: true
  
  # Восстанавливать конфигурацию при сбое
  restore-config-on-failure: true
  
  # Восстанавливать данные при сбое
  restore-data-on-failure: true
  
  # Уведомлять о восстановлении
  notify-restore: true
  
  # Логировать восстановление
  log-restore: true

# === Настройки тестирования ===
testing:
  # Тестировать обновления перед применением
  test-updates: true
  
  # Тестировать совместимость обновлений
  test-compatibility: true
  
  # Тестировать производительность обновлений
  test-performance: true
  
  # Тестировать безопасность обновлений
  test-security: true
  
  # Тестировать функциональность обновлений
  test-functionality: true
  
  # Логировать тестирование
  log-testing: true

# === Настройки версионирования ===
versioning:
  # Тип версионирования
  type: "semver"
  
  # Начальная версия
  initial-version: "1.0.0"
  
  # Автоматическое увеличение версии
  auto-increment: true
  
  # Префикс для версий
  version-prefix: "v"
  
  # Формат версии
  version-format: "major.minor.patch"
  
  # Автоматически обновлять файлы версий
  auto-update-files:
    - "package.json"
    - "pyproject.toml"
    - "setup.py"
    - "src/xvpn/__init__.py"

# === Настройки интеграции с CI/CD ===
ci-cd:
  # Интеграция с GitHub Actions
  github-actions:
    enabled: true
    workflow-file: ".github/workflows/ci-cd.yml"
    test-workflow: true
    deploy-workflow: true
    
  # Интеграция с Travis CI
  travis-ci:
    enabled: false
    config-file: ".travis.yml"
    
  # Интеграция с CircleCI
  circleci:
    enabled: false
    config-file: ".circleci/config.yml"
    
  # Интеграция с Jenkins
  jenkins:
    enabled: false
    pipeline-file: "Jenkinsfile"

# === Настройки анализа кода ===
code-analysis:
  # Анализировать код перед обновлением
  analyze-before-update: true
  
  # Анализировать зависимости перед обновлением
  analyze-dependencies: true
  
  # Анализировать безопасность перед обновлением
  analyze-security: true
  
  # Анализировать производительность перед обновлением
  analyze-performance: true
  
  # Анализировать совместимость перед обновлением
  analyze-compatibility: true
  
  # Логировать анализ
  log-analysis: true

# === Настройки отчетности ===
reporting:
  # Генерировать отчеты об обновлениях
  generate-update-reports: true
  
  # Генерировать отчеты о безопасности
  generate-security-reports: true
  
  # Генерировать отчеты о производительности
  generate-performance-reports: true
  
  # Генерировать отчеты о совместимости
  generate-compatibility-reports: true
  
  # Генерировать отчеты о тестировании
  generate-test-reports: true
  
  # Логировать отчеты
  log-reports: true

# === Настройки аудита ===
audit:
  # Аудит обновлений
  audit-updates: true
  
  # Аудит зависимостей
  audit-dependencies: true
  
  # Аудит безопасности
  audit-security: true
  
  # Аудит производительности
  audit-performance: true
  
  # Аудит совместимости
  audit-compatibility: true
  
  # Логировать аудит
  log-audit: true

# === Настройки лицензирования ===
licensing:
  # Проверять лицензии зависимостей
  check-licenses: true
  
  # Проверять совместимость лицензий
  check-license-compatibility: true
  
  # Проверять нарушения лицензий
  check-license-violations: true
  
  # Уведомлять о проблемах с лицензиями
  notify-license-issues: true
  
  # Логировать лицензии
  log-licenses: true

# === Настройки совместимости ===
compatibility:
  # Проверять совместимость обновлений
  check-compatibility: true
  
  # Проверять обратную совместимость
  check-backward-compatibility: true
  
  # Проверять совместимость с Python
  check-python-compatibility:
    versions:
      - "3.8"
      - "3.9"
      - "3.10"
      - "3.11"
      - "3.12"
  
  # Проверять совместимость с операционными системами
  check-os-compatibility:
    systems:
      - "ubuntu-20.04"
      - "ubuntu-22.04"
      - "ubuntu-24.04"
      - "debian-11"
      - "debian-12"
      - "centos-8"
      - "centos-9"
      - "rhel-8"
      - "rhel-9"
  
  # Проверять совместимость с архитектурами
  check-architecture-compatibility:
    architectures:
      - "x86_64"
      - "aarch64"
      - "armv7l"
  
  # Логировать совместимость
  log-compatibility: true

# === Настройки производительности ===
performance:
  # Мониторить производительность обновлений
  monitor-performance: true
  
  # Тестировать производительность обновлений
  test-performance: true
  
  # Сравнивать производительность до и после обновлений
  compare-performance: true
  
  # Уведомлять о проблемах с производительностью
  notify-performance-issues: true
  
  # Логировать производительность
  log-performance: true

# === Настройки безопасности ===
security:
  # Проверять зависимости на уязвимости
  check-dependencies: true
  
  # Автоматически обновлять уязвимые зависимости
  auto-update-vulnerable: true
  
  # Уведомлять о найденных уязвимостях
  vulnerability-notifications: true
  
  # Блокировать выпуск с уязвимостями
  block-release-with-vulnerabilities: true
  
  # Проверять лицензии на уязвимости
  check-license-vulnerabilities: true
  
  # Проверять код на уязвимости
  check-code-vulnerabilities: true
  
  # Логировать безопасность
  log-security: true

# === Настройки качества ===
quality:
  # Проверять качество кода перед обновлением
  check-code-quality: true
  
  # Проверять стиль кода перед обновлением
  check-code-style: true
  
  # Проверять документацию перед обновлением
  check-documentation: true
  
  # Проверять тесты перед обновлением
  check-tests: true
  
  # Логировать качество
  log-quality: true

# === Настройки документации ===
documentation:
  # Обновлять документацию при обновлении зависимостей
  update-documentation: true
  
  # Генерировать документацию при обновлении зависимостей
  generate-documentation: true
  
  # Проверять документацию при обновлении зависимостей
  check-documentation: true
  
  # Логировать документацию
  log-documentation: true

# === Настройки тестирования ===
testing:
  # Тестировать обновления перед применением
  test-updates: true
  
  # Тестировать совместимость обновлений
  test-compatibility: true
  
  # Тестировать производительность обновлений
  test-performance: true
  
  # Тестировать безопасность обновлений
  test-security: true
  
  # Тестировать функциональность обновлений
  test-functionality: true
  
  # Логировать тестирование
  log-testing: true

# === Настройки развертывания ===
deployment:
  # Развертывать обновления автоматически
  auto-deploy: true
  
  # Развертывать обновления по расписанию
  scheduled-deploy: true
  
  # Развертывать обновления по триггеру
  triggered-deploy: true
  
  # Логировать развертывание
  log-deployment: true

# === Настройки мониторинга ===
monitoring:
  # Мониторить зависимости
  monitor-dependencies: true
  
  # Мониторить обновления
  monitor-updates: true
  
  # Мониторить производительность
  monitor-performance: true
  
  # Мониторить безопасность
  monitor-security: true
  
  # Логировать мониторинг
  log-monitoring: true

# === Настройки уведомлений ===
notifications:
  # Уведомлять о новых версиях зависимостей
  dependency-updates: true
  
  # Уведомлять о найденных уязвимостях
  vulnerability-alerts: true
  
  # Уведомлять о заблокированных выпусках
  blocked-releases: true
  
  # Уведомлять о автоматических обновлениях
  auto-updates: true
  
  # Уведомлять о несовместимых обновлениях
  incompatible-updates: true
  
  # Уведомлять о производительности обновлений
  performance-impact: true
  
  # Логировать уведомления
  log-notifications: true

# === Настройки логирования ===
logging:
  # Логировать все операции
  log-all: true
  
  # Логировать ошибки
  log-errors: true
  
  # Логировать предупреждения
  log-warnings: true
  
  # Логировать информацию
  log-info: true
  
  # Логировать отладочную информацию
  log-debug: true
  
  # Логировать критическую информацию
  log-critical: true

# === Настройки архивации ===
archiving:
  # Архивировать зависимости
  archive-dependencies: true
  
  # Архивировать обновления
  archive-updates: true
  
  # Архивировать отчеты
  archive-reports: true
  
  # Логировать архивацию
  log-archiving: true

# === Настройки восстановления ===
restore:
  # Восстанавливать из архива при необходимости
  restore-from-archive: true
  
  # Восстанавливать конфигурацию из архива
  restore-config-from-archive: true
  
  # Восстанавливать данные из архива
  restore-data-from-archive: true
  
  # Логировать восстановление
  log-restore: true