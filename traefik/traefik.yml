# XVPN Traefik Configuration
# Production-ready TLS and routing configuration

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: xvpn-network
    endpoint: "unix:///var/run/docker.sock"

certificatesResolvers:
  myresolver:
    acme:
      email: admin@uss.hopto.org
      storage: "/letsencrypt/acme.json"
      tlsChallenge: {}

#serversTransport:
#  default:
#    insecureSkipVerify: false
#    rootCAs:
#      - "/etc/ssl/certs/ca-certificates.crt"

log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "200-299"
      - "400-499"
      - "500-599"
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop
      RequestHost: keep
      RequestURI: keep
      StatusCode: keep
      ContentLength: keep

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true