# XVPN GitHub Release Publisher
# Workflow для автоматической публикации релизов

name: Publish Release

on:
  # Запуск при создании тега
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"  # Пре-релизы
      
  # Запуск вручную
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create as draft"
        required: false
        default: false
        type: boolean

permissions:
  # Требуются для создания релизов
  contents: write
  # Требуются для создания GitHub Packages
  packages: write
  # Требуются для создания обсуждений
  discussions: write

jobs:
  # === Создание релиза ===
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      # === Проверка кода ===
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Необходимо для получения всех тегов

      # === Установка Node.js ===
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # === Создание релиза ===
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Changes in this Release
            
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes.
            
            ## Installation
            
            ```bash
            # Using pip
            pip install xvpn==${{ github.ref_name }}
            
            # Using Docker
            docker pull ghcr.io/${{ github.repository_owner }}/xvpn:${{ github.ref_name }}
            ```
            
            ## Documentation
            
            - [User Guide](https://github.com/${{ github.repository }}/blob/main/USER_GUIDE.md)
            - [Installation Guide](https://github.com/${{ github.repository }}/blob/main/INSTALLATION_GUIDE.md)
            - [API Documentation](https://github.com/${{ github.repository }}/blob/main/API_REFERENCE.md)
            
            ## Security
            
            For security advisories, please check the [Security Advisories](https://github.com/${{ github.repository }}/security/advisories) page.
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}

      # === Создание архива исходного кода ===
      - name: Create Source Archive
        run: |
          tar -czf xvpn-${{ github.ref_name }}.tar.gz --exclude='.git' .
          
      # === Загрузка архива в релиз ===
      - name: Upload Source Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./xvpn-${{ github.ref_name }}.tar.gz
          asset_name: xvpn-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip

  # === Сборка и публикация Docker образов ===
  docker-publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      # === Проверка кода ===
      - name: Checkout Code
        uses: actions/checkout@v4

      # === Установка QEMU для multi-arch сборки ===
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # === Установка Docker Buildx ===
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # === Вход в Docker Registry ===
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # === Вход в GitHub Container Registry ===
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # === Извлечение метаданных для Docker ===
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=ghcr.io/${{ github.repository }}
            name=${{ secrets.DOCKER_USERNAME }}/xvpn
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # === Сборка и пуш Docker образов ===
      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64,linux/arm/v7

  # === Публикация в PyPI ===
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [create-release, docker-publish]
    steps:
      # === Проверка кода ===
      - name: Checkout Code
        uses: actions/checkout@v4

      # === Установка Python ===
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # === Установка зависимостей ===
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # === Сборка пакета ===
      - name: Build Package
        run: |
          python -m build

      # === Публикация в Test PyPI ===
      - name: Publish to Test PyPI
        if: github.event.inputs.prerelease == 'true' || contains(github.ref, '-')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

      # === Публикация в PyPI ===
      - name: Publish to PyPI
        if: github.event.inputs.prerelease != 'true' && !contains(github.ref, '-')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  # === Уведомления о релизе ===
  release-notifications:
    name: Release Notifications
    runs-on: ubuntu-latest
    needs: [create-release, docker-publish, pypi-publish]
    if: always()
    steps:
      # === Уведомление в Slack ===
      - name: Notify Slack about Release
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: "#releases"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          icon_emoji: ":rocket:"
          username: "Release Bot"
          
      # === Уведомление в Telegram ===
      - name: Notify Telegram about Release
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="🚀 New release ${{ github.ref_name }} published for ${{ github.repository }}!"
            
      # === Уведомление по email ===
      - name: Notify Email about Release
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 New Release Published: XVPN ${{ github.ref_name }}"
          body: |
            A new release ${{ github.ref_name }} has been published for the XVPN repository.
            
            Repository: ${{ github.repository }}
            Tag: ${{ github.ref }}
            Commit: ${{ github.sha }}
            
            Please check the GitHub Releases page for details.
          to: releases@xvpn.local
          from: release-bot@xvpn.local

# === Настройки по умолчанию ===
defaults:
  run:
    shell: bash

# === Переменные среды ===
env:
  PYTHON_VERSION: "3.10"
  DOCKER_REGISTRY: "ghcr.io"
  IMAGE_NAME: ${{ github.repository }}

# === Секреты, необходимые для работы ===
# Для работы этого workflow необходимы следующие секреты:
# - GITHUB_TOKEN: токен GitHub для доступа к API
# - DOCKER_USERNAME: имя пользователя Docker Hub
# - DOCKER_PASSWORD: пароль Docker Hub
# - PYPI_API_TOKEN: токен PyPI для публикации
# - TEST_PYPI_API_TOKEN: токен Test PyPI для публикации
# - SLACK_WEBHOOK: webhook URL для Slack уведомлений
# - TELEGRAM_BOT_TOKEN: токен Telegram бота для уведомлений
# - TELEGRAM_CHAT_ID: ID чата для уведомлений
# - EMAIL_USERNAME: имя пользователя для email уведомлений
# - EMAIL_PASSWORD: пароль для email уведомлений

# === Переменные среды ===
# Следующие переменные могут быть установлены в настройках репозитория:
# - PYTHON_VERSION: версия Python для использования (по умолчанию 3.10)
# - DOCKER_REGISTRY: реестр Docker образов (по умолчанию ghcr.io)
# - IMAGE_NAME: имя образа (по умолчанию github.repository)