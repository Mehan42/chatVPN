version: "0.5"

processes:
  # Process to verify tunneling of non-RU traffic
  tunnel-checker:
    command: bash -c "echo 'Performing tunnel verification...' && sleep 10"
    restart: always
    working_dir: .
    environment:
      - CHECK_INTERVAL=30s
    log:
      path: ./logs/tunnel-checker.log
      maxSize: 10MB
      maxAge: 3
      compress: true
    health:
      exec: 
        command: "bash -c 'echo check tunnel status'"
      interval: 30s
      timeout: 5s
      startPeriod: 10s
      
  # Additional process for health monitoring
  health-check:
    command: bash -c "echo 'Checking tunnel health...' && sleep 30"
    restart: always
    depends_on:
      tunnel-checker:
        condition: process_healthy
    log:
      path: ./logs/health-check.log
      maxSize: 10MB
      maxAge: 3
      compress: true