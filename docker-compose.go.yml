version: '3.8'

services:
  xvpn-go-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-server
    container_name: xvpn-go-server
    restart: unless-stopped

    # Networking
    ports:
      - "8443:8443"
    networks:
      - xvpn-network

    # Environment
    environment:
      - XVPN_SERVER_PORT=8443
      - XVPN_DATABASE_PATH=/opt/xvpn/data/xvpn.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - XVPN_TLS_CERT=/opt/xvpn/tls/server.crt
      - XVPN_TLS_KEY=/opt/xvpn/tls/server.key

    # Volumes
    volumes:
      - xvpn-data:/opt/xvpn/data
      - xvpn-logs:/opt/xvpn/logs
      - xvpn-config:/opt/xvpn/config
      - xvpn-tls:/opt/xvpn/tls

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Security
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: xvpn-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - xvpn-network
    volumes:
      - ./monitoring/prometheus/go-server.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: xvpn-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - xvpn-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: xvpn-node-exporter
    restart: unless-stopped
    networks:
      - xvpn-network
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

networks:
  xvpn-network:
    driver: bridge

volumes:
  xvpn-data:
    driver: local
  xvpn-logs:
    driver: local
  xvpn-config:
    driver: local
  xvpn-tls:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local