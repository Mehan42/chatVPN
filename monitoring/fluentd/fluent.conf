# === Additional Configuration ===
# Additional fluentd configuration
additional_arguments:
  # Additional command line arguments
  - "--config=/etc/fluentd/fluent.conf"
  - "--log-level=info"
  - "--log-format=json"
  - "--log-file=/var/log/fluentd/fluentd.log"
  - "--daemonize=true"
  - "--pid-file=/var/run/fluentd/fluentd.pid"
  - "--root-dir=/var/lib/fluentd"
  - "--process-name=fluentd"
  - "--suppress-config-dump"
  - "--suppress-repeated-stacktrace"
  - "--without-source-check"
  - "--use-v1-config"
  - "--inline-config-option=system.log_level=info"
  - "--inline-config-option=system.log_format=json"
  - "--inline-config-option=system.log_file=/var/log/fluentd/fluentd.log"
  - "--inline-config-option=system.daemonize=true"
  - "--inline-config-option=system.pid_file=/var/run/fluentd/fluentd.pid"
  - "--inline-config-option=system.root_dir=/var/lib/fluentd"
  - "--inline-config-option=system.process_name=fluentd"
  - "--inline-config-option=system.suppress_config_dump=true"
  - "--inline-config-option=system.suppress_repeated_stacktrace=true"
  - "--inline-config-option=system.without_source_check=true"
  - "--inline-config-option=system.use_v1_config=true"