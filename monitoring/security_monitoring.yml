# === Certificate Monitoring ===
certificate_monitoring:
  # Enable certificate monitoring
  enabled: true
  
  # Certificate monitoring interval
  interval: 24h
  
  # Certificate monitoring timeout
  timeout: 60s
  
  # Certificate monitoring retries
  retries: 3
  
  # Certificate monitoring path
  path: /security/certificate
  
  # Certificate monitoring format
  format: json
  
  # Certificate monitoring file
  file: /var/log/xvpn/security/certificate.log
  
  # Certificate monitoring retention
  retention: 30d
  
  # Certificate monitoring aggregation
  aggregation: true
  
  # Certificate monitoring alerting
  alerting: true
  
  # Certificate monitoring thresholds
  thresholds:
    # Certificate expiration threshold
    expiration: 30  # days
    
    # Certificate revoked threshold
    revoked: 1
    
    # Certificate mismatch threshold
    mismatch: 1
    
    # Certificate weak algorithm threshold
    weak_algorithm: 5
    
    # Certificate weak key threshold
    weak_key: 5
    
    # Certificate self-signed threshold
    self_signed: 10
    
    # Certificate untrusted CA threshold
    untrusted_ca: 5

# === Network Security ===
