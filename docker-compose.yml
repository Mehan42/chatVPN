# XVPN Docker Compose for Production
# Конфигурация для production развертывания

version: '3.8'

# === Networks ===
networks:
  xvpn-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  traefik-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

# === Volumes ===
volumes:
  xvpn-data:
    driver: local
  xvpn-logs:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  traefik-letsencrypt:
    driver: local
  traefik-config:
    driver: local

# === Services ===
services:
  # === Traefik Load Balancer ===
  traefik:
    image: traefik:v2.10
    container_name: xvpn-traefik
    command:
      # API dashboard
      - "--api.insecure=true"
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Entry points
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.xvpn.address=:8443"
      # Let's Encrypt
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=admin@xvpn.local"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      # File provider
      - "--providers.file.filename=/etc/traefik/tls.yml"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      # Docker socket
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # SSL certificates
      - "traefik-letsencrypt:/letsencrypt"
      # Configuration files
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/tls.yml:/etc/traefik/tls.yml:ro"
    networks:
      - traefik-network
      - xvpn-network
    restart: unless-stopped
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      # Dashboard router
      - "traefik.http.routers.traefik.rule=Host(`traefik.xvpn.local`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  # === XVPN API Service ===
  xvpn-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: production
    container_name: xvpn-api
    command: uvx run --app server.api.app:app
    environment:
      # Flask environment
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - PYTHONUNBUFFERED=1
      # Database
      - DATABASE_URL=sqlite:////data/xvpn.db
      - REDIS_URL=redis://redis:6379/0
      # Logging
      - LOG_LEVEL=INFO
      # Configuration
      - XVPN_CONFIG_FILE=/config/api.json
    volumes:
      # Data persistence
      - "xvpn-data:/data"
      - "./config:/config:ro"
      # Cache
      - "uv-cache:/tmp/uv-cache"
    networks:
      - xvpn-network
    restart: unless-stopped
    depends_on:
      - redis
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      # API router
      - "traefik.http.routers.api.rule=Host(`api.xvpn.local`) || PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.services.api.loadbalancer.server.port=8443"
      - "traefik.http.middlewares.api-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.middlewares=api-stripprefix"
      # Health check
      - "traefik.http.routers.api.rule=Host(`api.xvpn.local`) || PathPrefix(`/api`) || PathPrefix(`/mcp`)"
      # Metrics
      - "traefik.http.routers.api.priority=10"
      # Security headers
      - "traefik.http.middlewares.api-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.api-headers.headers.sslredirect=true"
      - "traefik.http.routers.api.middlewares=api-stripprefix,api-headers"

  # === XVPN Agent Service ===
  xvpn-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
      target: production
    container_name: xvpn-agent
    command: uvx run --app server.agent.agent:main
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////data/agent.db
      - MANIFEST_URL=http://xvpn-api:8443/transports/manifest.json
      - HEALTH_URL=http://xvpn-api:8443/mcp/v1/vpn.health
      - AGENT_CONFIG_FILE=/config/agent.json
    volumes:
      - "xvpn-data:/data"
      - "./config:/config:ro"
      - "uv-cache:/tmp/uv-cache"
      # Knowledge base
      - "./server/agent/knowledge:/app/agent/knowledge:ro"
    networks:
      - xvpn-network
    restart: unless-stopped
    depends_on:
      - xvpn-api
      - redis
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      # Agent router
      - "traefik.http.routers.agent.rule=PathPrefix(`/agent`)"
      - "traefik.http.routers.agent.entrypoints=websecure"
      - "traefik.http.services.agent.loadbalancer.server.port=8443"
      - "traefik.http.middlewares.agent-stripprefix.stripprefix.prefixes=/agent"
      - "traefik.http.routers.agent.middlewares=agent-stripprefix"
      # Health check
      - "traefik.http.routers.agent.priority=20"

  # === XVPN Bot Service ===
  xvpn-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
      target: production
    container_name: xvpn-bot
    command: uvx run --app server.admin.tg_bot:main
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - API_BASE_URL=https://api.xvpn.local
      - BOT_CONFIG_FILE=/config/bot.json
    volumes:
      - "./config:/config:ro"
      - "uv-cache:/tmp/uv-cache"
    networks:
      - xvpn-network
    restart: unless-stopped
    depends_on:
      - xvpn-api
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      # Bot router
      - "traefik.http.routers.bot.rule=Host(`bot.xvpn.local`)"
      - "traefik.http.routers.bot.entrypoints=websecure"
      - "traefik.http.routers.bot.tls.certresolver=myresolver"
      - "traefik.http.services.bot.loadbalancer.server.port=8443"
      # Health check
      - "traefik.http.routers.bot.priority=30"
      # Security headers
      - "traefik.http.middlewares.bot-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.bot-headers.headers.sslredirect=true"
      - "traefik.http.routers.bot.middlewares=bot-headers"

  # === XVPN Worker Service ===
  xvpn-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: production
    container_name: xvpn-worker
    command: uvx run --app server.worker.worker:main
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - WORKER_COUNT=2
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - "xvpn-data:/data"
      - "./config:/config:ro"
      - "uv-cache:/tmp/uv-cache"
    networks:
      - xvpn-network
    restart: unless-stopped
    depends_on:
      - redis
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # === XVPN Orchestrator Service ===
  xvpn-orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.orchestrator
      target: production
    container_name: xvpn-orchestrator
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - XVPN_CONFIG_FILE=/app/orchestrator_config.json
    volumes:
      - "./server/agent/orchestrator_config.json:/app/orchestrator_config.json:ro"
      - "./server/agent/scripts:/app/scripts:ro"
      - "xvpn-data:/data"
      - "uv-cache:/tmp/uv-cache"
      # Logs
      - "/var/log/xvpn/orchestration:/var/log/xvpn/orchestration"
      - "/var/log/xvpn/agent:/var/log/xvpn/agent"
      - "/var/log/xvpn/api:/var/log/xvpn/api"
      - "/var/log/xvpn/core:/var/log/xvpn/core"
    networks:
      - xvpn-network
    restart: unless-stopped
    depends_on:
      - xvpn-api
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      # Orchestrator router
      - "traefik.http.routers.orchestrator.rule=Host(`orchestrator.xvpn.local`)"
      - "traefik.http.routers.orchestrator.entrypoints=websecure"
      - "traefik.http.routers.orchestrator.tls.certresolver=myresolver"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8080"
      # Health check
      - "traefik.http.routers.orchestrator.priority=15"
      # Security headers
      - "traefik.http.middlewares.orchestrator-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.orchestrator-headers.headers.sslredirect=true"
      - "traefik.http.routers.orchestrator.middlewares=orchestrator-headers"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # === Redis Cache ===
  redis:
    image: redis:7-alpine
    container_name: xvpn-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - "redis-data:/data"
      - "./config/redis.conf:/etc/redis/redis.conf:ro"
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      - "traefik.enable=false"  # Redis not accessible via Traefik

  # === PostgreSQL Database ===
  postgres:
    image: postgres:15-alpine
    container_name: xvpn-postgres
    environment:
      - POSTGRES_DB=xvpn
      - POSTGRES_USER=xvpn
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
      - "./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # === XVPN Core VPN Service ===
  xvpn-core:
    image: teddysun/xray:latest
    container_name: xvpn-core
    command: xray run -c /config/xray.json
    volumes:
      - "./config/xray:/config:ro"
      - "xvpn-data:/data"
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      # VPN router
      - "traefik.http.routers.vpn.rule=Host(`vpn.xvpn.local`)"
      - "traefik.http.routers.vpn.entrypoints=websecure"
      - "traefik.http.routers.vpn.tls.certresolver=myresolver"
      - "traefik.http.services.vpn.loadbalancer.server.port=443"
      # Health check
      - "traefik.http.routers.vpn.priority=5"
      # Security headers
      - "traefik.http.middlewares.vpn-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.vpn-headers.headers.sslredirect=true"
      - "traefik.http.routers.vpn.middlewares=vpn-headers"

  # === Monitoring and Logging ===
  grafana:
    image: grafana/grafana:latest
    container_name: xvpn-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      # Grafana router
      - "traefik.http.routers.grafana.rule=Host(`grafana.xvpn.local`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      # Security headers
      - "traefik.http.middlewares.grafana-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.grafana-headers.headers.sslredirect=true"
      - "traefik.http.routers.grafana.middlewares=grafana-headers"

  prometheus:
    image: prom/prometheus:latest
    container_name: xvpn-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=200h'
    volumes:
      - "prometheus-data:/prometheus"
      - "./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./monitoring/prometheus/rules:/etc/prometheus/rules:ro"
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # === Logging Agent ===
  loki:
    image: grafana/loki:latest
    container_name: xvpn-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - "loki-data:/data/loki"
      - "./monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml:ro"
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # === Node Exporter ===
  node-exporter:
    image: prom/node-exporter:latest
    container_name: xvpn-node-exporter
    command:
      - '--web.config.file=/etc/node-exporter/web.yml'
    ports:
      - "9100:9100"
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/rootfs:ro"
      - "./monitoring/node-exporter/web.yml:/etc/node-exporter/web.yml:ro"
    networks:
      - xvpn-network
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

# === Environment Variables ===
# Create a .env file in the project root with the following variables:
# BOT_TOKEN=your_telegram_bot_token_here
# CHAT_ID=your_chat_id_here
# POSTGRES_PASSWORD=your_postgres_password_here
# GRAFANA_PASSWORD=your_grafana_password_here

# === Commands for Use ===
# Start all services
# docker-compose up -d

# Stop all services
# docker-compose down

# View logs
# docker-compose logs -f [service_name]

# Update services
# docker-compose pull && docker-compose up -d --force-recreate

# Clean up unused volumes
# docker-compose down -v