# XVPN Fluent Bit Configuration
# Конфигурация легковесной системы агрегации логов Fluent Bit

# === Service Configuration ===
[SERVICE]
    # Flush interval
    Flush        5
    
    # Daemonize
    Daemon       Off
    
    # Log level
    Log_Level    info
    
    # Log file
    Log_File     /var/log/fluent-bit/fluent-bit.log
    
    # Parsers file
    Parsers_File parsers.conf
    
    # Plugins file
    Plugins_File plugins.conf
    
    # HTTP server
    HTTP_Server  On
    
    # HTTP port
    HTTP_Listen  0.0.0.0
    
    # HTTP port
    HTTP_Port    2020
    
    # Health check
    Health_Check On
    
    # Storage metrics
    Storage_Metrics On

# === Input Configuration ===
# === XVPN API Logs ===
[INPUT]
    Name              tail
    Path              /var/log/xvpn/api.log
    Parser            json
    Tag               xvpn.api
    Refresh_Interval  5
    Read_from_Head    true
    Buffer_Chunk_Size 32k
    Buffer_Max_Size   256k
    Skip_Long_Lines   On
    DB                /var/log/fluent-bit/xvpn.db
    Mem_Buf_Limit     5MB

