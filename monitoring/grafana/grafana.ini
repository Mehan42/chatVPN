auth_url = https://accounts.google.com/o/oauth2/auth
token_url = https://accounts.google.com/o/oauth2/token
api_url = https://www.googleapis.com/oauth2/v1/userinfo
allowed_domains = 
hosted_domain = 

# === Generic OAuth Configuration ===
[auth.generic_oauth]
enabled = false
name = OAuth
allow_sign_up = true
client_id = some_id
client_secret = some_secret
scopes = user:email,read:org
email_attribute_name = email:primary
email_attribute_path = 
login_attribute_path = 
id_token_attribute_name = 
auth_url = 
token_url = 
api_url = 
teams_url = 
allowed_domains = 
team_ids = 
allowed_organizations = 
role_attribute_path = 
role_attribute_strict = false
groups_attribute_path = 
empty_scopes = false
tls_skip_verify_insecure = false
tls_client_cert = 
tls_client_key = 
tls_client_ca = 
use_pkce = false

# === Basic Auth Configuration ===
[auth.basic]
enabled = true

# === LDAP Configuration ===
[auth.ldap]
enabled = false
config_file = /etc/grafana/ldap.toml
allow_sign_up = true

# === SMTP Configuration ===
[smtp]
enabled = false
host = localhost:25
user = 
# If the password contains # or ; you have to wrap it with triple quotes. Ex """#password;"""
password = 
cert_file = 
key_file = 
skip_verify = false
from_address = admin@grafana.localhost
from_name = Grafana
ehlo_identity = dashboard.example.com
startTLS_policy = 

[emails]
welcome_email_on_sign_up = false
templates_pattern = emails/*.html, emails/*.txt
content_types = text/html

# === Logging Configuration ===
[log]
# Either "console", "file", "syslog". Default is console and file
# Use space to separate multiple modes, e.g. "console file"
mode = console file

# Either "debug", "info", "warn", "error", "critical", default is "info"
level = info

# optional settings to set different levels for specific loggers. Ex filters = sqlstore:debug
filters = 

# For "console" mode only
[log.console]
level = 

# log line format, valid options are text, console and json
format = console

# For "file" mode only
[log.file]
level = 

# log line format, valid options are text, console and json
format = text

# This enables automated log rotate(switch of following options), default is true
log_rotate = true

# Max line number of single file, default is 1000000
max_lines = 1000000

# Max size shift of single file, default is 28 means 1 << 28, 256MB
max_size_shift = 28

# Segment log daily, default is true
daily_rotate = true

# Expired days of log file(delete after max days), default is 7
max_days = 7

# === Metrics Configuration ===
[metrics]
# Disable Grafana metrics
enabled = true

# Enable or disable alerting stats
disable_alerting_stats = false

# Enable or disable sending metrics to Grafana.net
# Publishing data to Grafana.net is deprecated and will be removed in a future release
publish_to_grafana_net = false

# Send anonymous usage reporting to Grafana
report_usage_stats = false

# If both are set, basic auth will be required for the metrics endpoint
basic_auth_username = 
basic_auth_password = 

# Metrics environment info adds dimensions to the `grafana_environment_info` metric, which
# can expose more information about the Grafana setup.
[metrics.environment_info]
# instance_name = ${HOSTNAME}
# software_version = ${SOFTWARE_VERSION}

# Send internal metrics to Graphite
[metrics.graphite]
# Enable by setting the address setting (ex localhost:2003)
address = 
prefix = prod.grafana.%(instance_name)s.

# === Tracing Configuration ===
[tracing.jaeger]
# Enable by setting the address sending traces to jaeger (ex localhost:6831)
address = jaeger:6831
# Tag that will always be included in when creating new spans. ex (tag1:value1,tag2:value2)
always_included_tag = 
# Type specifies the type of the sampler: const, probabilistic, rateLimiting, or remote
sampler_type = const
# Param is a value passed to the sampler.
# Valid values for Param field are:
# - for "const" sampler, 0 or 1 for always false/true respectively
# - for "probabilistic" sampler, a probability between 0 and 1
# - for "rateLimiting" sampler, the number of spans per second
# - for "remote" sampler, param is the same as for "probabilistic"
# and indicates the initial sampling rate before the actual one
# is received from the mothership
sampler_param = 1
# Whether or not to use Zipkin propagation (x-b3- HTTP headers).
zipkin_propagation = false
# Setting this to true disables shared RPC spans.
# Not disabling is the most common setting when using Zipkin elsewhere in your infrastructure.
disable_shared_zipkin_spans = false

# === Unified Alerting Configuration ===
[unified_alerting]
# Enable the unified alerting sub-system and interface. When enabled, it will take over rule
# management from the legacy alerting system.
enabled = true

# === Alerting Configuration ===
[alerting]
# Disable legacy alerting engine & UI features
enabled = false

# Makes it possible to turn off alert execution but alerting UI is visible
execute_alerts = true

# Default setting for new alert rules. Defaults to categorize error and timeouts as alerting. (alerting, keep_state)
error_or_timeout = alerting

# Default setting for new alert rules. Defaults to 30 seconds.
nodata_or_nullvalues = 30s

# Alert notifications can include images, but rendering many images at the same time can overload the server.
# The max_concurrent_render_requests setting can be used to limit the number of concurrent image renders.
# The default is 5.
max_concurrent_render_requests = 5

# === Explore Configuration ===
[explore]
# Enable the Explore section
enabled = true

# === Internal Metrics Configuration ===
[metrics.internal]
# Metrics prefix setting
prefix = prod.grafana.%(instance_name)s.

# === Panel Configuration ===
[panels]
# If set to true Grafana will allow script tags in text panels. Not recommended as it enables XSS vulnerabilities.
disable_sanitize_html = false

# === Plugins Configuration ===
[plugins]
enable_alpha = false
app_tls_skip_verify_insecure = false
# Enter a comma-separated list of plugin identifiers to identify plugins to load even if they are unsigned. Plugins with modified signatures are never loaded.
allow_loading_unsigned_plugins = 
# Enable or disable installing / updating plugins directly from within Grafana.
plugin_admin_enabled = false
plugin_catalog_url = https://grafana.com/grafana/plugins/

# === Rendering Configuration ===
[rendering]
# Options to configure a remote HTTP image rendering service, e.g. using https://github.com/grafana/grafana-image-renderer.
# URL to a remote HTTP image renderer service, e.g. http://localhost:8081/render
server_url = 
# If the remote HTTP image renderer service runs on a different server than the Grafana server in front of a load balancer, ensure that the host header is preserved for the remote HTTP image renderer service.
# When this value is set to true and the request to the remote HTTP image renderer service is configured using server_url, it will preserve the host header and use it for the request to the remote HTTP image renderer service.
preserve_host_header = false
# Concurrent render request limit affects when the /render HTTP endpoint is used. Rendering many images at the same time can overload the server,
# which this setting can help protect against by only allowing a certain amount of concurrent requests.
concurrent_render_request_limit = 30

# === Feature Toggles Configuration ===
[feature_toggles]
# Enable features that are in alpha-quality. Enabling these features might corrupt your database.
# Please take a backup before enabling them.
enable = 

# === Date Formats Configuration ===
[date_formats]
# For information on what formatting patterns that are supported https://momentjs.com/docs/#/displaying/format/

# Default system date format used in time range picker and other places where full time is displayed
full_date = YYYY-MM-DD HH:mm:ss

# Used by graph and other places where we only show small intervals
interval_second = HH:mm:ss
interval_minute = HH:mm
interval_hour = MM/DD HH:mm
interval_day = MM/DD
interval_month = YYYY-MM
interval_year = YYYY

# Experimental feature
use_browser_locale = false

# === Sentry Configuration ===
[sentry]
# Enabled reports to Sentry. To enable Grafana to automatically send crash reports to Sentry, set this option to true.
enabled = false
# DSN value for Sentry. This is provided by Sentry when you create a new project.
dsn = 
# Custom tags to be sent with the Sentry events.
custom_tags = 

# === External Image Storage Configuration ===
[external_image_storage]
# Used for uploading images to public servers so they can be included in slack/email messages.
# You can choose between (s3, webdav, gcs, azure_blob, local)
provider = local

# === External Image Storage Local Configuration ===
[external_image_storage.local]
# Path to directory where images will be stored
path = /var/lib/grafana/images

# === Provisioning Configuration ===
[provisioning]
# Path to directory containing provisioning files
path = /etc/grafana/provisioning

# === Cache Configuration ===
[cache]
# Type of cache to use (redis, memcached, inmemory)
type = inmemory

# Redis cache configuration
[cache.redis]
# Redis server address
addr = redis:6379
# Redis database index
db = 0
# Redis password
password = 
# Redis pool size
pool_size = 100

# === Live Configuration ===
[live]
# Max connection time to live
max_connection_ttl = 0

# Allowed origins
allowed_origins = ["*"]

# === Usage Statistics Configuration ===
[usage_stats]
# Enable sending anonymous usage statistics to Grafana
enabled = false

# === Instrumentation Configuration ===
[instrumentation]
# Enable instrumentation
enabled = true

# Address to bind to
address = 0.0.0.0:3001

# === Env Vars Configuration ===
[env_vars]
# Enable environment variable expansion in config
enabled = true

