# === Journal Log Parser ===
[PARSER]
    Name        journal
    Format      json
    Time_Key    __REALTIME_TIMESTAMP
    Time_Format %s.%N
    Time_Keep   On

# === Additional Configuration ===
# Additional parsers configuration
additional_arguments:
    # Additional command line arguments
    - "--parsers-file=/etc/fluent-bit/parsers.conf"
    - "--decode-field-as=json,message"
    - "--time-key=timestamp"
    - "--time-format=%Y-%m-%dT%H:%M:%S.%LZ"
    - "--time-keep=on"
    - "--regex=^(?<time>[^ ]* [^ ]*) (?<hostname>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?: *(?<message>.*)$"
    - "--time-key=time"
    - "--time-format=%b %d %H:%M:%S"